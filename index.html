  }
};

const jiPlatformsBase=drawPlatforms;
drawPlatforms=function(){
  jiPlatformsBase();
  if(typeof jgaMoving!=="undefined"){
    for(const gm of jgaMoving)jiDrawMovingPlatform(gm);
  }
};

drawPlayer=function(){
  if(invincible>0&&Math.floor(invincible/5)%2===0)return;
  const moving=Math.abs(player.vx)>1&&player.grounded&&!player.groundPound;
  const phase=Math.floor(performance.now()/105)%2;
  const img=player.groundPound?jiHero.pound:!player.grounded?jiHero.jump:moving?(phase?jiHero.run1:jiHero.run2):jiHero.idle;
  ctx.save();
  ctx.translate(player.x+player.w/2,player.y+player.h/2);
  if(player.dir<0)ctx.scale(-1,1);
  const s=(player.big?1.04:.86);
  const w=img.width*s,h=img.height*s;
  if(player.star){
    ctx.shadowColor=`hsl(${(Date.now()/7)%360},100%,70%)`;
    ctx.shadowBlur=24;
  }
  ctx.drawImage(img,-w/2,-h/2-8,w,h);
  ctx.restore();
};

drawEnemies=function(){
  const now=performance.now()/1000;
  for(const e of enemies){
    if(!e.alive)continue;
    const img=jiEnemy[e.type]||jiEnemy.walker;
    ctx.save();
    ctx.translate(e.x+e.w/2,e.y+e.h/2);
    if(e.vx<0)ctx.scale(-1,1);
    let bob=0,rot=0;
    if(e.type==="flyer")bob=Math.sin(now*6+e.phase)*4;
    else if(e.type==="shell"&&e.shellMoving)rot=now*7;
    else bob=Math.sin(now*7+e.x*.01)*1.5;
    ctx.rotate(rot);
    const sc=e.type==="flyer"?.58:.53;
    ctx.drawImage(img,-img.width*sc/2,-img.height*sc/2+bob,img.width*sc,img.height*sc);
    ctx.restore();
  }
};

drawBoss=function(){
  if(!boss||!boss.alive)return;
  const world=(typeof jgaWorld==="function"?jgaWorld():(boss.level||1));
  const img=jiBoss[Math.max(1,Math.min(4,world))]||jiBoss[1];
  ctx.save();
  ctx.translate(boss.x+boss.w/2,boss.y+boss.h/2);
  if(boss.dir<0)ctx.scale(-1,1);
  if(boss.hitTimer>0&&Math.floor(boss.hitTimer/4)%2===0)ctx.globalAlpha=.45;
  const pulse=1+Math.sin(performance.now()/210)*.018;
  const sc=.62*pulse;
  ctx.drawImage(img,-img.width*sc/2,-img.height*sc/2-18,img.width*sc,img.height*sc);
  ctx.restore();
};
</script>

 previousUpdate();if(encounter.phase==='waiting'&&encounter.gate){const limit=encounter.gate.x+encounter.gate.w+110;if(player.x>limit){player.x=limit;player.vx=Math.min(0,player.vx);message.textContent='土管の上で ▼ を押して入ろう';}}
};
const lava=plate(512,180,g=>{g.fillStyle=grad(g,0,0,0,180,['#ffde64','#fc7631','#c33226','#641f29']);g.fillRect(0,0,512,180);const r=rng(831);for(let i=0;i<95;i++){const x=r()*512,y=r()*180;oval(g,x,y,8+r()*32,2+r()*6,i%2?'#ffe59766':'#811f2955');}line(g,[[0,4],[512,4]],'#fff4a2',5);},2);
const previousBackground=drawBackground;
drawBackground=function(){if(!courses[currentCourse].boss||inSecret){previousBackground();return;}const key='hell:'+jgaWorld();if(!atlas.has(key))atlas.set(key,plate(2400,1080,g=>{g.fillStyle=grad(g,0,0,0,1080,['#211929','#602530','#bd4b30']);g.fillRect(0,0,2400,1080);const r=rng(703+jgaWorld());for(let i=0;i<23;i++){const x=i*115;poly(g,[[x-100,1000],[x+30,240+r()*320],[x+135,1000]],'#381f2b');line(g,[[x+30,490],[x+12,620],[x+52,720],[x+20,920]],'#e66d364a',5);}for(let i=0;i<130;i++)oval(g,r()*2400,r()*1000,1+r()*3,2+r()*3,'#ffc56688');}));const bg=atlas.get(key),off=cameraX*.14%2400;ctx.drawImage(bg,-off,0);if(off>480)ctx.drawImage(bg,2400-off,0);const shift=(performance.now()*.025)%512;for(let x=-512;x<WIDTH;x+=512)ctx.drawImage(lava,x+shift,900,512,HEIGHT-900);};
const previousPipes=drawPipes;
drawPipes=function(){previousPipes();if(encounter.phase==='waiting'&&encounter.gate){const p=encounter.gate;ctx.save();ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillStyle='#fff0b7';ctx.fillText('BOSS ▼',p.x+p.w/2,p.y-20);ctx.restore();}};
const previousPlayer=drawPlayer;
drawPlayer=function(){if(encounter.phase==='enter'||pipeTravel){ctx.save();const p=pipeTravel?pipeTravel.pipe:encounter.gate;ctx.beginPath();ctx.rect(p.x-70,0,p.w+140,p.y);ctx.clip();previousPlayer();ctx.restore();}else previousPlayer();};
const previousDraw=draw;
draw=function(){previousDraw();if(pipeTravel){ctx.save();ctx.fillStyle='rgba(15,10,20,'+Math.max(0,(pipeTravel.ticks-22)/20)+')';ctx.fillRect(0,0,WIDTH,HEIGHT);ctx.restore();return;}if(!['enter','reveal'].includes(encounter.phase))return;ctx.save();if(encounter.phase==='enter'){ctx.fillStyle='rgba(15,10,20,'+(encounter.ticks/42)+')';ctx.fillRect(0,0,WIDTH,HEIGHT);}else{const t=encounter.ticks;ctx.fillStyle='rgba(15,10,20,'+Math.max(0,1-t/25)+')';ctx.fillRect(0,0,WIDTH,HEIGHT);ctx.fillStyle='#140e20dd';ctx.fillRect(0,0,WIDTH,105);ctx.fillRect(0,HEIGHT-125,WIDTH,125);ctx.textAlign='center';ctx.font='900 48px sans-serif';ctx.fillStyle='#ffcf88';ctx.fillText('WORLD '+jgaWorld()+' — BOSS AWAKENS',WIDTH/2,HEIGHT-49);}ctx.restore();};
function openBossRoom(){currentWorldWidth=3200;platforms=[{x:0,y:760,w:3200,h:320},{x:850,y:570,w:260,h:38},{x:1530,y:490,w:240,h:38},{x:2110,y:570,w:260,h:38}];pipes=[{x:120,y:640,w:116,h:120,type:'sealed',cooldown:120}];blocks=[];enemies=[];worldCoins=[];items=[];jgaMoving=[];goalX=2940;checkpoint.enabled=true;checkpoint.active=true;checkpoint.x=370;checkpoint.y=640;player.x=370;player.y=760-player.h;player.vx=player.vy=0;cameraX=0;boss.arenaMin=1050;boss.arenaMax=2770;boss.x=2170;boss.y=540;boss.vx=-Math.abs(boss.vx||3);worldText.textContent=courses[currentCourse].name+' · ボスの間';}
// Reflect before collection / damage logic; pipes are full-height travel barriers for NPCs.
function blockPipeTravel(list){for(const e of list){if(e.alive===false||e.active===false)continue;for(const p of pipes){const v=e.vx||0;if(v>0&&e.x+e.w<=p.x+1&&e.x+e.w+v>=p.x){e.x=p.x-e.w;e.vx=-Math.abs(v);break;}if(v<0&&e.x>=p.x+p.w-1&&e.x+v<=p.x+p.w){e.x=p.x+p.w;e.vx=Math.abs(v);break;}if(e.x<p.x+p.w&&e.x+e.w>p.x){if(e.x+e.w/2<p.x+p.w/2){e.x=p.x-e.w;e.vx=-Math.abs(v||2);}else{e.x=p.x+p.w;e.vx=Math.abs(v||2);}break;}}}}
const pipeEnemyUpdate=updateEnemies,pipeItemUpdate=updateItems;
updateEnemies=function(){blockPipeTravel(enemies);pipeEnemyUpdate();blockPipeTravel(enemies);};
updateItems=function(){blockPipeTravel(items);pipeItemUpdate();};
window.JumporiaPipeTravel={get active(){return !!pipeTravel;}};
window.JumporiaEncounter={get phase(){return encounter.phase;},get gate(){return encounter.gate;}};
setupEncounter();

// Warm only the current world. Other world plates are built once on first visit.
background(inSecret?'cave':courses[currentCourse].type);terrain(inSecret?'cave':courses[currentCourse].type);['move','fall','blink'].forEach(movingArt);
window.JumporiaArt={version:47,get platesCreated(){return created;},get cachedSets(){return atlas.size;},prewarm(type){background(type);terrain(type);}};
})();

// Keep logical physics independent from adaptive raster resolution.
(()=>{let last=performance.now(),low=0,high=0;
const baseResize=resizeCanvas;
function apply(scale){jSiteRenderScale=scale;canvas.width=Math.round(WIDTH*scale);canvas.height=Math.round(HEIGHT*scale);ctx.setTransform(scale,0,0,scale,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';}
resizeCanvas=function(){baseResize();apply(Math.min(1.6,jSiteRenderScale));};resizeCanvas();
const prior=draw;draw=function(){prior();const now=performance.now();if(now-last<2400||paused)return;last=now;if(jSiteFps<43){low++;high=0;}else if(jSiteFps>57){high++;low=0;}else{low=0;high=0;}if(low>=2){apply(Math.max(.65,jSiteRenderScale-.15));low=0;}if(high>=5&&jSiteRenderScale<1.6){apply(Math.min(1.6,jSiteRenderScale+.1));high=0;}};
Object.values(jiBg).forEach(c=>{c.width=1;c.height=1;});Object.values(jiHero).forEach(c=>{c.width=1;c.height=1;});
})();
