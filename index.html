<head>

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;background:#10172c;color:#fff;font-family:Arial,"Yu Gothic",sans-serif;user-select:none}
body{display:flex;justify-content:center}
#app{width:100%;max-width:1200px;padding:8px}
#hud{
width:min(100%,1100px);
min-height:46px;
padding:5px 8px;
margin:0 auto 3px;
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
background:rgba(17,29,57,.92);
border-radius:10px;
box-sizing:border-box;
z-index:20;
}
#title{font-size:18px;white-space:nowrap}
#stats{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:12px;font-size:16px}
#gameFrame{
position:relative;
width:min(100vw,calc((100vh - 86px) * 16 / 9));
height:min(calc(100vh - 86px),calc(100vw * 9 / 16));
max-width:100vw;
max-height:calc(100vh - 86px);
margin:0 auto;
overflow:hidden;
border-radius:10px;
}
canvas{
display:block;
width:100%;
height:100%;
object-fit:contain;
aspect-ratio:16/9;
background:#8fd7ff;
image-rendering:auto;
}
#message{min-height:27px;margin-top:6px;text-align:center;font-weight:900;font-size:16px;color:#ffe96d}
#courseSelect{width:100%;min-height:44px;margin-top:8px;padding:0 12px;border-radius:10px;border:2px solid #3559a5;background:#172447;color:#fff;font-size:16px;font-weight:bold}
#controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
#movement{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ctrl{min-height:68px;border:none;border-radius:15px;font-size:26px;font-weight:900;color:#fff;background:linear-gradient(#3b80e3,#1956ad);border-bottom:6px solid #0b377e;box-shadow:0 5px 10px rgba(0,0,0,.25);touch-action:none}
.ctrl:active{transform:translateY(4px);border-bottom-width:2px}
#jumpBtn{background:linear-gradient(#ff9c31,#e75c16);border-bottom-color:#9c320b}
#downBtn{background:linear-gradient(#7d65e8,#5140aa);border-bottom-color:#31236f}
#bottomButtons{display:flex;gap:8px;margin-top:9px}
.smallBtn{flex:1;min-height:44px;border:0;border-radius:11px;background:#27385e;color:#fff;font-size:15px;font-weight:bold}
#help{padding-top:7px;text-align:center;color:#aabbe0;font-size:12px}
#courseSelect option:disabled{color:#7d89a8;background:#18223d}
.hidden{display:none!important}
.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 50% 20%,rgba(69,145,255,.25),transparent 35%),linear-gradient(180deg,#09142a,#10172c 55%,#101526)}
.menuCard{width:min(92vw,720px);max-height:92vh;overflow:auto;border:2px solid #456fc3;border-radius:24px;padding:24px;background:rgba(20,33,65,.97);box-shadow:0 22px 60px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.12)}
.logo{font-size:clamp(42px,8vw,82px);font-weight:1000;letter-spacing:3px;text-align:center;line-height:1;margin:8px 0 6px;background:linear-gradient(#fff7a8,#ffbf38 45%,#ff6d2e);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{text-align:center;color:#bcd2ff;font-weight:800;margin:0 0 22px}
.menuGrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.menuBtn{min-height:58px;border:0;border-radius:15px;padding:10px 14px;color:#fff;font-size:17px;font-weight:900;background:linear-gradient(#397ae0,#1f4eaa);border-bottom:5px solid #123775;box-shadow:0 6px 14px rgba(0,0,0,.25)}
.menuBtn:active{transform:translateY(3px);border-bottom-width:2px}
.menuBtn.primary{grid-column:1/-1;background:linear-gradient(#ffad3c,#ef651f);border-bottom-color:#a33b10;font-size:21px}
.menuBtn.secondary{background:linear-gradient(#445678,#293754);border-bottom-color:#18233a}
.panelTitle{font-size:28px;font-weight:1000;margin:0 0 15px;text-align:center}
.stageGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stageCard{min-height:96px;border:2px solid #4668a5;border-radius:15px;padding:12px;background:#172647;color:#fff;text-align:left;font-weight:900}
.stageCard.locked{filter:saturate(.3);opacity:.52}
.stageCard .small{display:block;color:#a9c1ec;font-size:12px;margin-top:5px}
.settingRow{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px 4px;border-bottom:1px solid rgba(255,255,255,.1);font-weight:900}
.toggleBtn{min-width:100px;min-height:40px;border:0;border-radius:12px;background:#315b9d;color:#fff;font-weight:900}
#topGameButtons{display:flex;gap:6px;align-items:center}
.iconBtn{width:42px;height:38px;border:0;border-radius:10px;background:#27385e;color:#fff;font-size:18px;font-weight:900}
#bossHud{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:15;width:min(66vw,560px);padding:8px 12px;border-radius:12px;background:rgba(18,20,37,.88);border:2px solid #b75f83;display:none}
#bossName{text-align:center;font-size:13px;font-weight:1000;margin-bottom:5px}
#bossBar{height:14px;background:#47253a;border-radius:20px;overflow:hidden}
#bossBarFill{height:100%;width:100%;background:linear-gradient(90deg,#ffca56,#ff4f7d);transition:width .2s}
#pauseBadge{
position:absolute;
inset:0;
z-index:30;
display:none;
align-items:center;
justify-content:center;
background:rgba(5,10,25,.62);
backdrop-filter:blur(4px);
}
@media(max-width:600px){.menuCard{padding:17px}.menuGrid,.stageGrid{grid-template-columns:1fr}}
@media(max-width:600px){
  #app{padding:4px}
  #hud{padding:6px 8px}
  #title{font-size:13px}
  #stats{gap:6px;font-size:12px}
  .ctrl{min-height:60px;font-size:22px}
  #controls{gap:7px}
}
@media(orientation:landscape) and (max-height:650px){
  html,body{height:100%;overflow:hidden}
  body{align-items:center}
  #app{
    width:100vw;
    max-width:none;
    height:100vh;
    padding:3px;
    position:relative;
  }
  #hud{
    position:absolute;
    z-index:10;
    top:5px;
    left:50%;
    transform:translateX(-50%);
    width:min(70vw,850px);
    margin:0;
    padding:5px 10px;
    background:rgba(18,31,61,.88);
    backdrop-filter:blur(5px);
  }
  #gameFrame{
    width:100%;
    height:100%;
    border-radius:8px;
  }
  canvas{
    width:100%;
    height:100%;
    aspect-ratio:auto;
    object-fit:contain;
    background:#63c8ff;
  }
  #message{
    position:absolute;
    z-index:11;
    top:47px;
    left:50%;
    transform:translateX(-50%);
    margin:0;
    min-height:22px;
    font-size:13px;
    pointer-events:none;
    text-shadow:0 2px 4px #000;
  }
  #courseSelect,
  #bottomButtons,
  #help{display:none}
  #controls{
    position:absolute;
    z-index:20;
    inset:0;
    pointer-events:none;
    display:block;
    margin:0;
  }
  #movement{
    position:absolute;
    left:10px;
    bottom:10px;
    width:260px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:7px;
    pointer-events:auto;
  }
  #jumpBtn{
    position:absolute;
    right:16px;
    bottom:16px;
    width:135px;
    height:72px;
    pointer-events:auto;
  }
  .ctrl{
    min-height:62px;
    opacity:.9;
    font-size:22px;
    border-bottom-width:4px;
  }
  #title{font-size:13px}
  #stats{font-size:12px}
}
</style>

<body>
<div id="homeScreen" class="overlay">
  <div class="menuCard">
    <div class="logo">JUMPORIA</div>
    <div class="tagline">RUN · JUMP · DISCOVER</div>
    <div class="menuGrid">
      <button id="continueBtn" class="menuBtn primary">▶ つづきから</button>

      <button id="fullscreenBtn" class="menuBtn secondary">⛶ 全画面</button>

  <div class="menuCard">
    <div class="panelTitle">🗺️ STAGE SELECT</div>

    <button id="stageBackBtn" class="menuBtn secondary" style="width:100%;margin-top:14px">← ホームへ</button>
  </div>
</div>

<div id="settingsScreen" class="overlay hidden">
  <div class="menuCard">
    <div class="panelTitle">⚙️ SETTINGS</div>
    <div class="settingRow"><span>画面の揺れ</span><button id="shakeToggle" class="toggleBtn">ON</button></div>

<div id="app">
  <div id="hud">
    <div id="title">⭐ JUMPORIA ULTRA HD+ FIXED</div>
    <div id="stats">
      <span>WORLD <span id="worldText">1-1</span></span>
      <span>🪙 <span id="coinText">0</span></span>

<script>
"use strict";

const canvas=document.getElementById("canvas");
const gameFrame=document.getElementById("gameFrame");
const ctx=canvas.getContext("2d");
const WIDTH=1920, HEIGHT=1080;

function resizeCanvas(){
  // Keep the logical game view at the full 1920×1080.
  // Backing pixels are scaled equally with the drawing transform,
  // so the bottom/right of the course can never be cropped.
  const renderScale=Math.min(Math.max(window.devicePixelRatio||1,1.5),3);
  canvas.width=Math.round(WIDTH*renderScale);
  canvas.height=Math.round(HEIGHT*renderScale);
  ctx.setTransform(renderScale,0,0,renderScale,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality="high";
}
resizeCanvas();
window.addEventListener("resize",resizeCanvas);

const worldText=document.getElementById("worldText");
const coinText=document.getElementById("coinText");
const lifeText=document.getElementById("lifeText");
const scoreText=document.getElementById("scoreText");
const message=document.getElementById("message");
const courseSelect=document.getElementById("courseSelect");
const homeScreen=document.getElementById("homeScreen");
const stageScreen=document.getElementById("stageScreen");
const settingsScreen=document.getElementById("settingsScreen");
const stageGrid=document.getElementById("stageGrid");
const pauseBadge=document.getElementById("pauseBadge");
const bossHud=document.getElementById("bossHud");
const bossBarFill=document.getElementById("bossBarFill");
let paused=false;
let shakeEnabled=localStorage.getItem("jumporiaShake")!=="off";
let controlOpacity=Number(localStorage.getItem("jumporiaControlOpacity")||0.9);
let deferredInstallPrompt=null;

const input={left:false,right:false,jumpPressed:false,jumpHeld:false,down:false};

let currentCourse=0,coins=0,lives=3,score=0,cameraX=0,running=true,clear=false;
let maxUnlockedStage=Math.max(0,Math.min(4,Number(localStorage.getItem("jumpAdventureUnlocked")||0)));
let invincible=0,starTimer=0,jumpHoldFrames=0,screenShake=0;
const MAX_JUMP_HOLD=18;

const player={
  x:120,y:610,w:52,h:64,normalH:64,bigH:94,
  vx:0,vy:0,speed:8.5,jumpPower:-19,grounded:false,dir:1,
  big:false,star:false,groundPound:false,groundPoundReady:true
};

const courses=[
{
  name:"1-1",type:"grass",width:9000,startX:120,
  platforms:[
    [0,760,1150,140],[1280,760,900,140],[2310,760,1150,140],[3600,760,930,140],
    [4660,760,1100,140],[5900,760,1000,140],[7040,760,820,140],[7980,760,1020,140],
    [700,550,240,40],[1520,500,260,40],[2480,540,260,40],[3100,420,240,40],
    [3900,500,260,40],[4950,530,250,40],[5350,410,240,40],[6200,500,260,40],
    [7350,520,250,40],[7700,400,240,40]
  ],
  blocks:[
    [520,540,"coin"],[620,540,"power"],[720,540,"coin"],
    [1570,350,"coin"],[1634,350,"shield"],[1698,350,"star"],
    [2520,390,"coin"],[2584,390,"magnet"],[2648,390,"power"],
    [3950,350,"brick"],[4050,350,"coin"],
    [5000,380,"star"],[5064,380,"boots"],[6250,350,"power"],[6314,350,"speed"],
    [7400,370,"coin"],[7500,370,"brick"]
  ],
  pipes:[
    [1030,620,110,140,"solid"],[2070,580,130,180,"warp",5400],
    [3380,600,120,160,"solid"],[4480,560,130,200,"solid"],
    [5750,620,110,140,"solid"],[6890,580,130,180,"solid"]
  ],

function compactBlockRows(list){
  const rows=new Map();
  for(const b of list){
    const key=Math.round(b.y/8)*8;
    if(!rows.has(key))rows.set(key,[]);
    rows.get(key).push(b);
  }
  for(const row of rows.values()){
    row.sort((a,b)=>a.x-b.x);
    for(let i=1;i<row.length;i++){
      const prev=row[i-1],cur=row[i];
      const gap=cur.x-(prev.x+prev.w);
      if(gap>0&&gap<=46)cur.x=prev.x+prev.w;
    }
  }
  return list;
}

function snapPipesToSupportedPlatforms(){
  if(inSecret)return;
  for(const p of pipes){
    const cx=p.x+p.w/2;
    // find a platform whose horizontal span supports most of the pipe and whose top is near the pipe bottom
    const candidates=platforms.filter(pl=>
      p.x>=pl.x-8 &&
      p.x+p.w<=pl.x+pl.w+8 &&
      Math.abs((p.y+p.h)-pl.y)<150
    );
    if(candidates.length){
      candidates.sort((a,b)=>Math.abs((p.y+p.h)-a.y)-Math.abs((p.y+p.h)-b.y));
      const pl=candidates[0];
      p.y=pl.y-p.h;
    }
  }
}

function overlap(a,b){
  return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}

function growPlayer(){
  if(player.big)return;
  const bottom=player.y+player.h;
  player.big=true; player.h=player.bigH; player.y=bottom-player.h;
  const blockers=[...blocks.filter(b=>!b.broken),...pipes];
  if(blockers.some(o=>overlap(player,o))){
    player.big=false; player.h=player.normalH; player.y=bottom-player.h;
  }
}

function hitBlock(block){
  if(block.broken)return;
  if(block.type==="brick"){
    if(player.big||player.groundPound){
      block.broken=true; addScore(200); screenShake=10; message.textContent="💥 BLOCK BREAK!";
    }else{
      block.bump=12; message.textContent="硬いブロック！";
    }
    return;
  }
  if(block.used)return;
  block.used=true; block.bump=12; addScore(100); spawnItem(block);
}

function damage(){
  if(invincible>0||player.star)return;
  if(shieldTimer>0){
    shieldTimer=0;
    invincible=100;

    const bottom=player.y+player.h;
    player.big=false; player.h=player.normalH; player.y=bottom-player.h;
    invincible=120; message.textContent="POWER DOWN!"; return;
  }
  lives--; lifeText.textContent=lives;

function solidObjects(){
  return [
    ...blocks.filter(b=>!b.broken).map(b=>({...b,kind:"block"})),
    ...pipes.map(p=>({...p,kind:"pipe"}))
  ];
}

function resolveHorizontal(){
  for(const o of solidObjects()){
    if(!overlap(player,o))continue;
    if(player.vx>0)player.x=o.x-player.w;
    else if(player.vx<0)player.x=o.x+o.w;
    player.vx=0;
  }
}

function tryWarp(){
  if(!input.down||!player.grounded)return;
  for(const p of pipes){
    if((p.type!=="warp"&&p.type!=="exit")||p.cooldown>0)continue;
    const centered=player.x+player.w/2>p.x+15&&player.x+player.w/2<p.x+p.w-15;
    const onTop=Math.abs((player.y+player.h)-p.y)<8;
    if(!centered||!onTop)continue;

    p.cooldown=90;

    if(p.type==="warp"){
      enterSecretArea(p.target);
    }else if(p.type==="exit"){
      exitSecretArea();
    }
    return;
  }
}

function triggerGroundPound(){
  if(player.grounded||player.groundPound||!player.groundPoundReady)return;
  player.groundPound=true; player.groundPoundReady=false; player.vx*=0.3; player.vy=24;
  message.textContent="💥 HIP DROP!";
}

function groundPoundImpact(){
  screenShake=16; addScore(100);
  const cx=player.x+player.w/2;
  for(const e of enemies){
    if(!e.alive)continue;
    if(Math.abs((e.x+e.w/2)-cx)<110&&Math.abs((e.y+e.h)-(player.y+player.h))<100){
      if(e.type==="spike")continue;
      e.alive=false; addScore(250);
    }
  }
  for(const b of blocks){
    if(b.broken)continue;
    if(b.type==="brick"&&Math.abs((b.x+b.w/2)-cx)<90&&b.y>player.y){
      b.broken=true; addScore(200);
    }
  }
}

function updatePlayer(){
  const speed=player.star?12:(speedTimer>0?player.speed*1.38:player.speed);

  if(!player.groundPound){
    if(input.left){player.vx=-speed;player.dir=-1}
    else if(input.right){player.vx=speed;player.dir=1}
    else{player.vx*=.78;if(Math.abs(player.vx)<.15)player.vx=0}
  }

  player.x+=player.vx;
  player.x=Math.max(0,Math.min(currentWorldWidth-player.w,player.x));
  resolveHorizontal();

  if(input.down&&!player.grounded)triggerGroundPound();

  const oldY=player.y;

  if(!player.groundPound){
    player.vy+=1.05;
    if(input.jumpHeld&&player.vy<0&&jumpHoldFrames<MAX_JUMP_HOLD){
      player.vy-=.52;jumpHoldFrames++;
    }
  }else{
    player.vy=Math.max(player.vy,24);
  }

  player.y+=player.vy;
  player.grounded=false;

  const floorObjects=[
    ...platforms.map(p=>({...p,kind:"platform"})),
    ...blocks.filter(b=>!b.broken).map(b=>({...b,kind:"block"})),
    ...pipes.map(p=>({...p,kind:"pipe"}))
  ];

  for(const o of floorObjects){
    const horizontal=player.x+player.w>o.x&&player.x<o.x+o.w;
    if(!horizontal)continue;

    const oldBottom=oldY+player.h, newBottom=player.y+player.h;
    if(player.vy>=0&&oldBottom<=o.y+10&&newBottom>=o.y){
      player.y=o.y-player.h; player.vy=0; player.grounded=true; jumpHoldFrames=0;

      if(player.groundPound){
        player.groundPound=false;
        groundPoundImpact();
      }
      player.groundPoundReady=true;
    }

    if(o.kind==="block"){
      const oldTop=oldY,newTop=player.y;
      if(player.vy<0&&oldTop>=o.y+o.h-10&&newTop<=o.y+o.h){
        player.y=o.y+o.h; player.vy=2; jumpHoldFrames=MAX_JUMP_HOLD;
        const original=blocks.find(b=>b.x===o.x&&b.y===o.y);
        if(original)hitBlock(original);
      }
    }
  }

  if(input.jumpPressed&&player.grounded&&!player.groundPound){
    player.vy=jumpBoostTimer>0?player.jumpPower-4:player.jumpPower; player.grounded=false; jumpHoldFrames=0; player.groundPoundReady=true;
  }
  input.jumpPressed=false;

  tryWarp();

  if(player.y>HEIGHT+180)damage();
}

function updateCoins(){
  for(const c of worldCoins){
    if(c.collected)continue;
    c.rot+=.12;
    let dx=player.x+player.w/2-c.x,dy=player.y+player.h/2-c.y;
    let distance=Math.hypot(dx,dy);
    if(magnetTimer>0&&distance<340&&distance>1){
      c.x+=dx/distance*8.5;
      c.y+=dy/distance*8.5;
      dx=player.x+player.w/2-c.x;
      dy=player.y+player.h/2-c.y;
      distance=Math.hypot(dx,dy);
    }
    if(distance<44){
      c.collected=true;coins++;coinText.textContent=coins;addScore(100);message.textContent="🪙 COIN!";
    }
  }
}

function updateItems(){
  for(const item of items){
    if(!item.active)continue;
    item.vy+=.75; item.x+=item.vx; item.y+=item.vy;

    const floors=[...platforms,...pipes,...blocks.filter(b=>!b.broken)];
    for(const p of floors){
      if(item.x+item.w>p.x&&item.x<p.x+p.w&&item.y+item.h>p.y&&item.y+item.h<p.y+30&&item.vy>=0){
        item.y=p.y-item.h;
        if(item.type==="star")item.vy=-10;else item.vy=0;
      }
    }
    if(overlap(player,item)){
      item.active=false;
      if(item.type==="power"){growPlayer();addScore(1000);message.textContent="🍄 POWER UP!"}
      else if(item.type==="star"){player.star=true;starTimer=600;addScore(1500);message.textContent="⭐ STAR POWER!"}
      else if(item.type==="shield"){shieldTimer=900;addScore(800);message.textContent="🛡️ SHIELD 15s!"}
      else if(item.type==="magnet"){magnetTimer=900;addScore(800);message.textContent="🧲 COIN MAGNET 15s!"}
      else if(item.type==="boots"){jumpBoostTimer=900;addScore(800);message.textContent="👢 HIGH JUMP 15s!"}
      else if(item.type==="speed"){speedTimer=900;addScore(800);message.textContent="⚡ SPEED UP 15s!"}
    }
  }
}

function updateEnemies(){
  for(const e of enemies){
    if(!e.alive)continue;

    if(e.type==="flyer"){
      e.x+=e.vx;
      e.phase+=.06;
      e.y=e.baseY+Math.sin(e.phase)*45;
    }else{
      e.x+=e.vx;
    }

    if(e.x<e.min||e.x>e.max)e.vx*=-1;

    for(const p of pipes){
      if(overlap(e,p))e.vx*=-1;
    }

    if(!overlap(player,e))continue;

    if(player.star){
      e.alive=false;addScore(300);continue;
    }

    if(player.groundPound){
      if(e.type==="spike"){
        damage();
      }else{
        e.alive=false;addScore(300);player.vy=-8;player.groundPound=false;
      }
      continue;
    }

    const playerBottom=player.y+player.h;

    if(player.vy>2&&playerBottom<e.y+32&&e.type!=="spike"){
      if(e.type==="shell"&&!e.shellMoving){
        e.shellMoving=true;e.h=34;e.y+=24;e.vx=0;player.vy=-12;addScore(200);message.textContent="SHELL STOP!";
      }else if(e.type==="shell"&&e.shellMoving){
        e.vx=player.dir*8;player.vy=-12;addScore(200);message.textContent="SHELL KICK!";
      }else{
        e.alive=false;player.vy=-12;addScore(200);message.textContent="NICE!";
      }
    }else{
      if(e.type==="shell"&&e.shellMoving&&Math.abs(e.vx)<1)e.vx=player.dir*8;
      else damage();
    }
  }

  for(const shell of enemies.filter(e=>e.alive&&e.type==="shell"&&e.shellMoving&&Math.abs(e.vx)>4)){
    for(const e of enemies){
      if(!e.alive||e===shell)continue;
      if(overlap(shell,e)){
        e.alive=false;addScore(300);shell.vx*=.96;
      }
    }
  }
}

function updateBoss(){
  if(!boss||!boss.alive)return;
  if(boss.hitTimer>0)boss.hitTimer--;
  boss.phase++;boss.chargeTimer++;

  if(boss.grounded&&boss.chargeTimer>150){
    boss.chargeTimer=0;
    boss.vx=(player.x<boss.x?-1:1)*(boss.hp<=3?7.2:5.4);
    if(Math.random()<.55)boss.vy=-13;
  }

  boss.vy+=0.8;
  boss.x+=boss.vx;
  boss.y+=boss.vy;
  boss.grounded=false;

  const floorY=760-boss.h;
  if(boss.y>=floorY){boss.y=floorY;boss.vy=0;boss.grounded=true}
  if(boss.x<2450){boss.x=2450;boss.vx=Math.abs(boss.vx)}
  if(boss.x+boss.w>3310){boss.x=3310-boss.w;boss.vx=-Math.abs(boss.vx)}
  boss.dir=boss.vx>=0?1:-1;

  if(overlap(player,boss)&&boss.hitTimer<=0){
    const stomp=player.vy>2&&(player.y+player.h)<boss.y+75;
    if(player.star||player.groundPound||stomp){
      boss.hp--;boss.hitTimer=45;boss.vx=(boss.x<player.x?-1:1)*6;boss.vy=-7;
      player.vy=-15;player.groundPound=false;screenShake=shakeEnabled?16:0;
      addScore(1000);bossBarFill.style.width=`${Math.max(0,boss.hp/boss.maxHp*100)}%`;
      message.textContent=`BOSS HIT! ${boss.hp}/${boss.maxHp}`;
      if(boss.hp<=0){
        boss.alive=false;bossHud.style.display="none";addScore(10000);
        running=false;clear=true;localStorage.setItem("jumporiaAllClear","1");
        message.textContent="👑 BOSS DEFEATED! WORLD CLEAR!";
      }
    }else damage();
  }
}

function updateBlocks(){
  for(const b of blocks)if(b.bump>0)b.bump--;
}
function updateTimers(){
  if(invincible>0)invincible--;
  if(player.star){starTimer--;if(starTimer<=0){player.star=false;message.textContent="STAR END"}}
  if(shieldTimer>0)shieldTimer--;

function checkGoal(){
  if(inSecret||boss)return;
  if(player.x>goalX){
    running=false;
    clear=true;
    addScore(5000);
    if(currentCourse<courses.length-1&&maxUnlockedStage<currentCourse+1){
      maxUnlockedStage=currentCourse+1;
      localStorage.setItem("jumpAdventureUnlocked",String(maxUnlockedStage));
      refreshCourseLocks();
      message.textContent="🏁 COURSE CLEAR!  次のステージ解放！";
    }else{
      message.textContent="🏁 COURSE CLEAR!";
    }
  }
}
function updateCamera(){
  const max=Math.max(0,currentWorldWidth-WIDTH);
  const target=player.x-WIDTH*.30;
  cameraX+=(target-cameraX)*.09;
  cameraX=Math.max(0,Math.min(max,cameraX));
}
function update(){
  if(paused||!running)return;
  updatePlayer();updateCoins();updateItems();updateEnemies();updateBoss();updateBlocks();updateTimers();checkGoal();updateCamera();
}

function drawBackground(){
  if(inSecret){
    drawSecretBackground();
    return;
  }
  const type=courses[currentCourse].type;
  let top,mid,bottom;
  if(type==="cave"){top="#0c1638";mid="#1c2451";bottom="#382746"}
  else if(type==="fortress"){top="#160d1d";mid="#34203a";bottom="#6a3442"}
  else if(type==="sunset"){top="#f65f50";mid="#ff9860";bottom="#ffd891"}
  else if(type==="sky"){top="#1787db";mid="#65c8f7";bottom="#d9f7ff"}
  else{top="#279ee9";mid="#6fd0f8";bottom="#d6f5ff"}

  const grad=ctx.createLinearGradient(0,0,0,HEIGHT);
  grad.addColorStop(0,top);grad.addColorStop(.55,mid);grad.addColorStop(1,bottom);
  ctx.fillStyle=grad;ctx.fillRect(0,0,WIDTH,HEIGHT);

  if(type==="cave")drawCaveBackground();

    drawSun(type);
    drawFarMountains(type);
    if(type==="sky")drawSkyGameBackground();

    drawClouds();

function drawAdventureBackground(type){
  // Layered floating shapes, banners and sparkles for a stronger game-world feel.
  ctx.save();

  // far floating islands
  for(let i=0;i<11;i++){
    const wx=420+i*780;
    const x=wx-cameraX*.12;
    const y=300+(i%3)*95;
    const w=150+(i%2)*55;
    ctx.fillStyle=type==="sunset"?"rgba(91,75,97,.34)":"rgba(57,126,139,.26)";
    ctx.beginPath();
    ctx.ellipse(x,y,w*.55,26,0,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x-w*.38,y+10);
    ctx.lineTo(x,y+90);
    ctx.lineTo(x+w*.38,y+10);
    ctx.closePath();
    ctx.fill();
  }

  // tiny game-like sparkles / collectibles in distant sky
  ctx.fillStyle=type==="sunset"?"rgba(255,240,178,.62)":"rgba(255,255,255,.65)";
  for(let i=0;i<26;i++){
    const x=(i*277-cameraX*.08)%2200;
    const y=70+(i*83)%420;
    const r=2+(i%3);
    ctx.beginPath();
    ctx.moveTo(x,y-r*2);ctx.lineTo(x+r,y-r/2);ctx.lineTo(x+r*2,y);
    ctx.lineTo(x+r,y+r/2);ctx.lineTo(x,y+r*2);ctx.lineTo(x-r,y+r/2);
    ctx.lineTo(x-r*2,y);ctx.lineTo(x-r,y-r/2);ctx.closePath();ctx.fill();
  }

  // distant checkpoint flags / towers
  for(let i=0;i<7;i++){
    const x=650+i*1300-cameraX*.20;
    const base=650;
    ctx.strokeStyle=type==="sunset"?"rgba(96,61,84,.38)":"rgba(62,108,127,.34)";
    ctx.lineWidth=8;
    ctx.beginPath();ctx.moveTo(x,base);ctx.lineTo(x,base-145);ctx.stroke();
    ctx.fillStyle=type==="sunset"?"rgba(255,192,93,.35)":"rgba(115,230,205,.34)";
    ctx.beginPath();ctx.moveTo(x,base-145);ctx.lineTo(x+66,base-120);ctx.lineTo(x,base-94);ctx.closePath();ctx.fill();
  }

  ctx.restore();
}

function drawSkyGameBackground(){
  ctx.save();

  // parallax floating cloud islands
  for(let i=0;i<15;i++){
    const wx=250+i*610;
    const x=wx-cameraX*.16;
    const y=350+(i%4)*95;
    const w=170+(i%3)*35;

    // underside
    const ug=ctx.createLinearGradient(x,y,x,y+105);
    ug.addColorStop(0,"rgba(97,148,171,.5)");
    ug.addColorStop(1,"rgba(53,92,129,.08)");
    ctx.fillStyle=ug;
    ctx.beginPath();
    ctx.moveTo(x-w*.42,y+16);
    ctx.quadraticCurveTo(x,y+118,x+w*.42,y+16);
    ctx.closePath();
    ctx.fill();

    // cloud top
    const cg=ctx.createLinearGradient(x,y-35,x,y+35);
    cg.addColorStop(0,"rgba(255,255,255,.96)");
    cg.addColorStop(1,"rgba(201,237,248,.88)");
    ctx.fillStyle=cg;
    for(let j=0;j<5;j++){
      ctx.beginPath();
      ctx.arc(x-w*.35+j*w*.18,y+(j%2)*7,34+(j%2)*10,0,Math.PI*2);
      ctx.fill();
    }
  }

  // sky rails / rings / stars to feel like a game stage
  for(let i=0;i<8;i++){
    const x=500+i*1000-cameraX*.30;
    const y=170+(i%3)*70;
    ctx.strokeStyle="rgba(255,238,119,.42)";
    ctx.lineWidth=7;
    ctx.beginPath();ctx.arc(x,y,28,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle="rgba(255,255,255,.24)";
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(x,y,37,0,Math.PI*2);ctx.stroke();
  }

  // distant airships / structures, original silhouette
  for(let i=0;i<5;i++){
    const x=900+i*1750-cameraX*.10;
    const y=255+(i%2)*100;
    ctx.fillStyle="rgba(52,103,142,.22)";
    ctx.beginPath();ctx.ellipse(x,y,85,24,0,0,Math.PI*2);ctx.fill();
    ctx.fillRect(x-25,y+15,50,26);
    ctx.beginPath();ctx.moveTo(x-15,y+40);ctx.lineTo(x,y+68);ctx.lineTo(x+15,y+40);ctx.closePath();ctx.fill();
  }

  // vertical light shafts
  for(let i=0;i<6;i++){
    const x=250+i*430-cameraX*.05;
    const g=ctx.createLinearGradient(x,0,x+120,0);
    g.addColorStop(0,"rgba(255,255,255,0)");
    g.addColorStop(.5,"rgba(255,255,255,.06)");
    g.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=g;ctx.fillRect(x,0,120,HEIGHT);
  }

  ctx.restore();
}

function drawPlatforms(){
  const type=inSecret?"cave":courses[currentCourse].type;

  for(const p of platforms){
    if(type==="sky"&&p.h<=50){
      const g=ctx.createLinearGradient(0,p.y,0,p.y+p.h);
      g.addColorStop(0,"#ffffff");
      g.addColorStop(.42,"#e5f8ff");
      g.addColorStop(1,"#8fc6df");
      ctx.fillStyle=g;
      ctx.beginPath();
      ctx.roundRect(p.x,p.y,p.w,p.h,22);
      ctx.fill();

      ctx.fillStyle="rgba(255,255,255,.72)";
      ctx.beginPath();
      ctx.roundRect(p.x+10,p.y+5,p.w-20,9,8);
      ctx.fill();

      ctx.strokeStyle="rgba(70,130,160,.28)";
      ctx.lineWidth=3;
      ctx.stroke();
      continue;
    }

    if(type==="cave"){
      const rock=ctx.createLinearGradient(0,p.y,0,p.y+p.h);
      rock.addColorStop(0,"#7f718b");

function drawBlocks(){
  const active=blocks.filter(b=>!b.broken);

  function hasNeighbor(b,dx){
    return active.some(o=>o!==b&&Math.abs(o.y-b.y)<2&&Math.abs(o.x-(b.x+dx))<2);
  }

  for(const b of active){
    const bumpY=b.bump>0?-Math.sin((12-b.bump)/12*Math.PI)*16:0;
    const x=b.x,y=b.y+bumpY;
    const left=hasNeighbor(b,-b.w),right=hasNeighbor(b,b.w);

    if(b.type==="brick"){
      const g=ctx.createLinearGradient(x,y,x,y+b.h);
      g.addColorStop(0,"#d67a43");
      g.addColorStop(.45,"#b85c34");
      g.addColorStop(1,"#7b3825");
      ctx.fillStyle=g;
      ctx.fillRect(x,y,b.w,b.h);

      ctx.fillStyle="rgba(255,255,255,.20)";
      ctx.fillRect(x,y,b.w,5);

      ctx.strokeStyle="#713421";
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(x,y+32);ctx.lineTo(x+b.w,y+32);
      ctx.moveTo(x+32,y);ctx.lineTo(x+32,y+32);
      ctx.moveTo(x+16,y+32);ctx.lineTo(x+16,y+64);
      ctx.moveTo(x+48,y+32);ctx.lineTo(x+48,y+64);
      ctx.stroke();

      if(!left){ctx.fillStyle="#843d27";ctx.fillRect(x,y,4,b.h)}
      if(!right){ctx.fillStyle="#5d2a1c";ctx.fillRect(x+b.w-4,y,4,b.h)}
      continue;
    }

    if(b.used){
      const g=ctx.createLinearGradient(x,y,x,y+b.h);
      g.addColorStop(0,"#c79a69");
      g.addColorStop(.5,"#9a6845");
      g.addColorStop(1,"#70442d");
      ctx.fillStyle=g;
      ctx.fillRect(x,y,b.w,b.h);

      ctx.fillStyle="rgba(255,255,255,.16)";
      ctx.fillRect(x,y,b.w,5);

      ctx.strokeStyle="#684027";
      ctx.lineWidth=2;
      if(!left)ctx.strokeRect(x+1,y+1,2,b.h-2);
      if(!right)ctx.strokeRect(x+b.w-3,y+1,2,b.h-2);
      continue;
    }

    const g=ctx.createLinearGradient(x,y,x,y+b.h);
    g.addColorStop(0,"#fff77a");
    g.addColorStop(.22,"#ffd94e");
    g.addColorStop(.58,"#efa51f");
    g.addColorStop(1,"#bd690b");
    ctx.fillStyle=g;
    ctx.fillRect(x,y,b.w,b.h);

    const shine=ctx.createLinearGradient(x,y,x+b.w,y);
    shine.addColorStop(0,"rgba(255,255,255,.08)");
    shine.addColorStop(.4,"rgba(255,255,255,.45)");
    shine.addColorStop(1,"rgba(255,255,255,.02)");
    ctx.fillStyle=shine;
    ctx.fillRect(x+7,y+6,b.w-14,7);

    ctx.strokeStyle="#935108";
    ctx.lineWidth=3;
    if(!left){ctx.beginPath();ctx.moveTo(x+1,y);ctx.lineTo(x+1,y+b.h);ctx.stroke()}
    if(!right){ctx.beginPath();ctx.moveTo(x+b.w-1,y);ctx.lineTo(x+b.w-1,y+b.h);ctx.stroke()}
    ctx.beginPath();ctx.moveTo(x,y+1);ctx.lineTo(x+b.w,y+1);ctx.moveTo(x,y+b.h-1);ctx.lineTo(x+b.w,y+b.h-1);ctx.stroke();

    ctx.fillStyle="rgba(90,50,0,.45)";
    for(const px of [9,b.w-9]){
      for(const py of [10,b.h-10]){
        ctx.beginPath();ctx.arc(x+px,y+py,3,0,Math.PI*2);ctx.fill();
      }
    }

    const symbol=b.type==="shield"?"◆":b.type==="magnet"?"U":b.type==="boots"?"⇧":b.type==="speed"?"⚡":"?";
    ctx.fillStyle="#fffdf1";
    ctx.font=b.type==="speed"?"900 30px Arial":"900 42px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.strokeStyle="#97550c";
    ctx.lineWidth=7;
    ctx.strokeText(symbol,x+b.w/2,y+b.h/2+3);
    ctx.fillText(symbol,x+b.w/2,y+b.h/2+3);
  }

  ctx.textAlign="left";
  ctx.textBaseline="alphabetic";
}
function drawPipes(){
  const skyStage=!inSecret&&courses[currentCourse].type==="sky";
  for(const p of pipes){
    // Sky-stage pipes look as if they rise from far below the cloud platforms.
    const visualBottom=skyStage?Math.max(HEIGHT+140,p.y+p.h):p.y+p.h;
    const stemTop=p.y+30;
    const stemHeight=Math.max(0,visualBottom-stemTop);

    if(skyStage){
      // soft shadow below rim
      const shadow=ctx.createLinearGradient(p.x,p.y,p.x,visualBottom);
      shadow.addColorStop(0,"rgba(15,70,92,.22)");
      shadow.addColorStop(1,"rgba(15,70,92,0)");
      ctx.fillStyle=shadow;
      ctx.fillRect(p.x+18,p.y+35,p.w-36,stemHeight);
    }

    const body=ctx.createLinearGradient(p.x,0,p.x+p.w,0);
    body.addColorStop(0,skyStage?"#075b82":"#075d31");
    body.addColorStop(.14,skyStage?"#1697bd":"#20a756");
    body.addColorStop(.32,skyStage?"#73e9ed":"#70e57a");
    body.addColorStop(.48,skyStage?"#36c9d5":"#39c566");
    body.addColorStop(.72,skyStage?"#117f9c":"#14964a");
    body.addColorStop(1,skyStage?"#06435f":"#064828");

    ctx.fillStyle=body;
    ctx.fillRect(p.x+14,stemTop,p.w-28,stemHeight);

    const rim=ctx.createLinearGradient(p.x,0,p.x+p.w,0);
    rim.addColorStop(0,skyStage?"#06445f":"#064b29");
    rim.addColorStop(.14,skyStage?"#1da2c4":"#24a95a");
    rim.addColorStop(.34,skyStage?"#9af7f2":"#83ef86");
    rim.addColorStop(.62,skyStage?"#35cbd1":"#2ab95f");
    rim.addColorStop(1,skyStage?"#053d54":"#054525");

    ctx.fillStyle=rim;
    ctx.beginPath();
    ctx.roundRect(p.x,p.y,p.w,42,8);
    ctx.fill();

    ctx.fillStyle="rgba(255,255,255,.34)";
    ctx.fillRect(p.x+18,p.y+6,12,30);
    ctx.fillRect(p.x+26,p.y+44,8,Math.max(0,stemHeight-14));

    ctx.fillStyle="rgba(0,0,0,.18)";
    ctx.fillRect(p.x+p.w-20,p.y+8,10,Math.max(34,stemHeight+14));

    ctx.strokeStyle=skyStage?"#063b55":"#054226";
    ctx.lineWidth=4;
    ctx.strokeRect(p.x+14,p.y+40,p.w-28,Math.max(0,stemHeight-10));

    ctx.strokeStyle="rgba(255,255,255,.18)";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(p.x+34,p.y+44);
    ctx.lineTo(p.x+34,visualBottom-8);
    ctx.stroke();

    if(skyStage){
      // cloud ring where the pipe meets the platform
      ctx.fillStyle="rgba(245,253,255,.95)";
      for(let i=0;i<5;i++){
        ctx.beginPath();
        ctx.arc(p.x+16+i*(p.w-32)/4,p.y+43,18+(i%2)*4,0,Math.PI*2);
        ctx.fill();
      }
    }

    if(p.type==="warp"||p.type==="exit"){
      ctx.fillStyle=p.type==="exit"?"#9effe6":"#fff46c";
      ctx.font="900 18px Arial";
      ctx.textAlign="center";
      ctx.shadowColor="rgba(0,0,0,.55)";
      ctx.shadowBlur=4;
      ctx.fillText(p.type==="exit"?"EXIT ▼":"SECRET ▼",p.x+p.w/2,p.y-10);
      ctx.shadowBlur=0;
      ctx.textAlign="left";
    }
  }
}

      ctx.beginPath();ctx.ellipse(27,41,11,6,0,0,Math.PI*2);ctx.fill();

      ctx.fillStyle="#4d2118";
      ctx.beginPath();ctx.roundRect(2,48+walk,19,8,5);ctx.roundRect(31,48-walk,19,8,5);ctx.fill();
    }

    ctx.restore();
  }
}
function drawPlayer(){
  if(invincible>0&&Math.floor(invincible/5)%2===0)return;

  const t=performance.now()/1000;
  const run=Math.abs(player.vx)>1&&player.grounded&&!player.groundPound;
  const stride=run?Math.sin(t*18)*7:0;
  const bob=run?Math.abs(Math.sin(t*18))*2:0;

  ctx.save();
  ctx.translate(player.x+player.w/2,player.y+player.h/2+bob);

  if(player.groundPound)ctx.rotate(Math.PI);
  else if(!player.grounded)ctx.rotate(Math.max(-.12,Math.min(.12,player.vx*.012)));

  if(player.dir<0)ctx.scale(-1,1);

  if(player.star){
    const hue=(Date.now()/8)%360;
    ctx.shadowColor=`hsl(${hue},100%,65%)`;
    ctx.shadowBlur=26;
  }

  const scale=player.big?1.16:1;
  ctx.scale(scale,scale);

  const H=player.big?78:60;
  const top=-H/2;
  const bottom=H/2;

  // shadow (drawn in local space for soft visual depth)
  ctx.save();
  ctx.globalAlpha=.18;
  ctx.fillStyle="#000";
  ctx.beginPath();
  ctx.ellipse(0,bottom+9,25,6,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();

  // back leg
  ctx.fillStyle="#163d5d";
  ctx.beginPath();
  ctx.roundRect(-14,bottom-24-stride*.25,13,25,6);
  ctx.fill();

  // front leg
  ctx.fillStyle="#235d83";
  ctx.beginPath();
  ctx.roundRect(2,bottom-25+stride*.25,14,26,6);
  ctx.fill();

  // shoes
  let shoeG=ctx.createLinearGradient(0,bottom-5,0,bottom+8);
  shoeG.addColorStop(0,"#f4f5f8");
  shoeG.addColorStop(1,"#aeb7c4");
  ctx.fillStyle=shoeG;
  ctx.beginPath();
  ctx.roundRect(-18,bottom-5-stride*.2,19,10,5);
  ctx.roundRect(2,bottom-5+stride*.2,20,10,5);
  ctx.fill();
  ctx.fillStyle="#29323b";
  ctx.fillRect(-17,bottom+2-stride*.2,18,3);
  ctx.fillRect(3,bottom+2+stride*.2,18,3);

  // torso / adventure jacket
  const bodyG=ctx.createLinearGradient(0,top+22,0,bottom-15);
  bodyG.addColorStop(0,"#ff9a35");
  bodyG.addColorStop(.55,"#ee672b");
  bodyG.addColorStop(1,"#b83f26");
  ctx.fillStyle=bodyG;
  ctx.beginPath();
  ctx.roundRect(-21,top+23,42,H*.48,12);
  ctx.fill();

  // teal harness
  ctx.fillStyle="#167e86";
  ctx.beginPath();
  ctx.roundRect(-15,top+34,30,H*.34,8);
  ctx.fill();
  ctx.strokeStyle="#42bbc0";
  ctx.lineWidth=2;
  ctx.stroke();

  // straps and zipper
  ctx.strokeStyle="#d9f5f2";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(-9,top+27);ctx.lineTo(-5,bottom-12);
  ctx.moveTo(9,top+27);ctx.lineTo(5,bottom-12);
  ctx.stroke();
  ctx.strokeStyle="#572b24";
  ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,top+26);ctx.lineTo(0,bottom-12);ctx.stroke();

  // arms with running animation
  const armSwing=run?stride*.55:0;
  ctx.lineCap="round";
  ctx.strokeStyle="#f07a30";
  ctx.lineWidth=11;
  ctx.beginPath();
  ctx.moveTo(-17,top+31);ctx.lineTo(-26,top+45+armSwing);
  ctx.moveTo(17,top+31);ctx.lineTo(27,top+44-armSwing);
  ctx.stroke();

  // gloves
  ctx.fillStyle="#f6efe5";
  ctx.beginPath();
  ctx.arc(-27,top+47+armSwing,7,0,Math.PI*2);
  ctx.arc(28,top+46-armSwing,7,0,Math.PI*2);
  ctx.fill();

  // neck/scarf
  ctx.fillStyle="#ffd04d";
  ctx.beginPath();
  ctx.roundRect(-14,top+18,28,9,4);
  ctx.fill();
  ctx.fillStyle="#e8a929";
  ctx.beginPath();
  ctx.moveTo(8,top+24);ctx.lineTo(23,top+34);ctx.lineTo(10,top+37);ctx.closePath();
  ctx.fill();

  // head
  const skin=ctx.createRadialGradient(-5,top+7,3,0,top+12,26);
  skin.addColorStop(0,"#ffe0ba");
  skin.addColorStop(.65,"#e7af7d");
  skin.addColorStop(1,"#bd7b58");
  ctx.fillStyle=skin;
  ctx.beginPath();
  ctx.roundRect(-17,top,34,28,11);
  ctx.fill();

  // hair
  ctx.fillStyle="#203142";
  ctx.beginPath();
  ctx.arc(-5,top+2,14,Math.PI,Math.PI*2);
  ctx.arc(8,top+3,11,Math.PI,Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-16,top+5);ctx.lineTo(-22,top+14);ctx.lineTo(-13,top+13);ctx.closePath();ctx.fill();

  // navy explorer cap, intentionally original design
  const capG=ctx.createLinearGradient(0,top-9,0,top+5);
  capG.addColorStop(0,"#3971a7");
  capG.addColorStop(1,"#183d6c");
  ctx.fillStyle=capG;
  ctx.beginPath();
  ctx.roundRect(-20,top-7,39,11,5);
  ctx.fill();
  ctx.beginPath();
  ctx.roundRect(-13,top-13,27,9,5);
  ctx.fill();
  ctx.fillStyle="#58b9c2";
  ctx.fillRect(-4,top-10,8,4);

  // ear
  ctx.fillStyle="#e4a777";
  ctx.beginPath();ctx.ellipse(-18,top+14,4,6,0,0,Math.PI*2);ctx.fill();

  // eye + brow
  ctx.fillStyle="#fff";
  ctx.beginPath();ctx.ellipse(7,top+11,5.5,6,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#263847";
  ctx.beginPath();ctx.arc(8.5,top+12,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(9.3,top+11.1,.8,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#55392f";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(2,top+5);ctx.lineTo(12,top+4);ctx.stroke();

  // nose
  ctx.fillStyle="#e3a477";
  ctx.beginPath();ctx.ellipse(16,top+15,5,4,0,0,Math.PI*2);ctx.fill();

  // smile
  ctx.strokeStyle="#633b33";ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(8,top+19,6,.15,1.2);ctx.stroke();

  // jacket highlights
  ctx.strokeStyle="rgba(255,255,255,.38)";
  ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-17,top+29);ctx.lineTo(-12,top+25);ctx.stroke();

  ctx.restore();
}

function drawUltraDetailPass(){
  ctx.save();
  // subtle atmospheric depth
  const haze=ctx.createLinearGradient(0,0,0,HEIGHT);
  haze.addColorStop(0,"rgba(255,255,255,.035)");
  haze.addColorStop(.55,"rgba(255,255,255,0)");
  haze.addColorStop(1,"rgba(10,20,40,.045)");
  ctx.fillStyle=haze;ctx.fillRect(0,0,WIDTH,HEIGHT);

  // tiny foreground grass/stone details near ground
  if(!inSecret){
    const base=Math.floor(cameraX/90)*90;
    for(let wx=base;wx<cameraX+WIDTH+100;wx+=90){
      const x=wx-cameraX;
      const seed=Math.abs(Math.sin(wx*0.017));
      if(courses[currentCourse].type==="grass"||courses[currentCourse].type==="sunset"){
        ctx.strokeStyle=`rgba(35,112,58,${.18+seed*.12})`;
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(x,758);ctx.lineTo(x-5,744-seed*8);
        ctx.moveTo(x+2,758);ctx.lineTo(x+8,741-seed*6);
        ctx.stroke();
      }else if(courses[currentCourse].type==="fortress"){
        ctx.fillStyle="rgba(255,130,72,.12)";
        ctx.beginPath();ctx.arc(x,748,2+seed*2,0,Math.PI*2);ctx.fill();
      }
    }
  }
  ctx.restore();
}

function drawBuffStatus(){
  const buffs=[];
  if(shieldTimer>0)buffs.push(["🛡️",shieldTimer]);
  if(magnetTimer>0)buffs.push(["🧲",magnetTimer]);
  if(speedTimer>0)buffs.push(["⚡",speedTimer]);
  if(jumpBoostTimer>0)buffs.push(["👢",jumpBoostTimer]);
  if(player.star)buffs.push(["⭐",starTimer]);
  if(!buffs.length)return;
  let x=20,y=105;
  ctx.save();ctx.font="900 18px Arial";
  for(const [icon,timer] of buffs){
    ctx.fillStyle="rgba(8,18,39,.82)";ctx.beginPath();ctx.roundRect(x,y,106,34,11);ctx.fill();
    ctx.fillStyle="#fff";ctx.fillText(`${icon} ${Math.ceil(timer/60)}s`,x+11,y+23);x+=114;
  }
  ctx.restore();
}
function drawGoal(){
  if(inSecret||boss)return;
  const pole=ctx.createLinearGradient(goalX,0,goalX+18,0);
  pole.addColorStop(0,"#fff");pole.addColorStop(.5,"#b8bec6");pole.addColorStop(1,"#f4f4f4");
  ctx.fillStyle=pole;ctx.fillRect(goalX,350,18,410);
  ctx.fillStyle="#ffd744";ctx.beginPath();ctx.arc(goalX+9,350,19,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#ef4e4e";ctx.beginPath();ctx.moveTo(goalX+18,370);ctx.lineTo(goalX+145,415);ctx.lineTo(goalX+18,455);ctx.closePath();ctx.fill();
}

function drawEnd(){
  if(running)return;
  ctx.fillStyle="rgba(7,11,25,.68)";ctx.fillRect(0,0,WIDTH,HEIGHT);
  ctx.textAlign="center";ctx.fillStyle="#fff";ctx.font="900 86px Arial";
  ctx.fillText(clear?"COURSE CLEAR!":"GAME OVER",WIDTH/2,HEIGHT/2-20);
  ctx.font="900 32px Arial";
  ctx.fillText(
    clear
      ? (currentCourse<courses.length-1 ? `SCORE ${score}   COINS ${coins}   NEXT STAGE UNLOCKED!` : `SCORE ${score}   COINS ${coins}   ALL CLEAR!`)
      : "「コースをやり直す」で再挑戦",
    WIDTH/2,
    HEIGHT/2+55
  );
  ctx.textAlign="left";
}

function draw(){
  ctx.clearRect(0,0,WIDTH,HEIGHT);
  drawBackground();

  const sx=shakeEnabled&&screenShake>0?(Math.random()-.5)*10:0;
  const sy=shakeEnabled&&screenShake>0?(Math.random()-.5)*8:0;

  ctx.save();ctx.translate(-cameraX+sx,sy);
  drawPlatforms();drawPipes();drawBlocks();drawCoins();drawItems();drawEnemies();drawBoss();drawGoal();drawUltraDetailPass();drawPlayer();drawBuffStatus();
  ctx.restore();

  drawEnd();
}

function showOnly(screen){
  homeScreen.classList.add("hidden");stageScreen.classList.add("hidden");settingsScreen.classList.add("hidden");
  if(screen)screen.classList.remove("hidden");
}
function goHome(){
  paused=true;pauseBadge.style.display="none";bossHud.style.display="none";showOnly(homeScreen);buildStageGrid();
}
function startStage(i){
  if(i>maxUnlockedStage)return;
  paused=false;pauseBadge.style.display="none";showOnly(null);loadCourse(i);fitGameToViewport();
}
function buildStageGrid(){
  stageGrid.innerHTML="";
  const labels=[["WORLD 1-1","草原とパイプ"],["WORLD 1-2","地下洞窟"],["WORLD 1-3","夕焼け高原"],["WORLD 1-4","天空アスレチック"],["WORLD 1-BOSS","黒曜石砦・IRON HORN"]];
  labels.forEach((s,i)=>{
    const locked=i>maxUnlockedStage,btn=document.createElement("button");
    btn.className="stageCard"+(locked?" locked":"");
    btn.innerHTML=`${locked?"🔒":"▶"} ${s[0]}<span class="small">${locked?"前のステージをクリアすると解放":s[1]}</span>`;
    btn.disabled=locked;btn.addEventListener("click",()=>startStage(i));stageGrid.appendChild(btn);
  });
}
function togglePause(){
  if(!homeScreen.classList.contains("hidden"))return;
  paused=!paused;
  pauseBadge.style.display=paused?"flex":"none";
  document.getElementById("pauseBtn").textContent=paused?"▶":"Ⅱ";
}
function applyControlOpacity(){
  document.querySelectorAll(".ctrl").forEach(b=>b.style.opacity=String(controlOpacity));
  document.getElementById("controlOpacityBtn").textContent=Math.round(controlOpacity*100)+"%";
}
function updateSettingsUI(){
  document.getElementById("shakeToggle").textContent=shakeEnabled?"ON":"OFF";applyControlOpacity();
}
async function requestFullscreen(){
  try{
    if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();
    else if(document.exitFullscreen)await document.exitFullscreen();
  }catch(e){}
}

const mobileControls=document.getElementById("controls");
if(mobileControls && mobileControls.parentElement!==gameFrame){
  gameFrame.appendChild(mobileControls);
}

function fitGameToViewport(){
  const hudHeight=44;
  const vv=window.visualViewport;
  const vw=Math.max(1,Math.floor(vv?vv.width:window.innerWidth));
  const vh=Math.max(1,Math.floor(vv?vv.height:window.innerHeight));
  const safeW=Math.max(160,vw-4);
  const safeH=Math.max(100,vh-hudHeight-4);
  const ratio=WIDTH/HEIGHT;

  let frameW=safeW;
  let frameH=frameW/ratio;
  if(frameH>safeH){
    frameH=safeH;
    frameW=frameH*ratio;
  }

  frameW=Math.max(1,Math.floor(frameW));
  frameH=Math.max(1,Math.floor(frameH));

  gameFrame.style.width=frameW+"px";
  gameFrame.style.height=frameH+"px";
  gameFrame.style.top=(hudHeight+2)+"px";
  gameFrame.style.left="50%";
  gameFrame.style.transform="translateX(-50%)";
}

function loop(){update();draw();requestAnimationFrame(loop)}
refreshCourseLocks();buildStageGrid();updateSettingsUI();loadCourse(Math.min(maxUnlockedStage,4));paused=true;fitGameToViewport();loop();

window.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(e.key==="Escape"||k==="p"){togglePause();e.preventDefault();return}
  if(e.key==="ArrowLeft"||k==="a"){input.left=true;e.preventDefault()}
  if(e.key==="ArrowRight"||k==="d"){input.right=true;e.preventDefault()}
  if(e.key==="ArrowDown"||k==="s"){input.down=true;if(!player.grounded)triggerGroundPound();e.preventDefault()}
  if(e.key==="ArrowUp"||e.key===" "||k==="w"){
    if(!input.jumpHeld)input.jumpPressed=true;
    input.jumpHeld=true;e.preventDefault();
  }
});
window.addEventListener("keyup",e=>{
  const k=e.key.toLowerCase();
  if(e.key==="ArrowLeft"||k==="a")input.left=false;
  if(e.key==="ArrowRight"||k==="d")input.right=false;
  if(e.key==="ArrowDown"||k==="s")input.down=false;
  if(e.key==="ArrowUp"||e.key===" "||k==="w"){input.jumpHeld=false;jumpHoldFrames=MAX_JUMP_HOLD}
});

function bindHold(id,prop){
  const btn=document.getElementById(id);
  btn.addEventListener("pointerdown",e=>{e.preventDefault();input[prop]=true});
  const release=e=>{e.preventDefault();input[prop]=false};
  btn.addEventListener("pointerup",release);btn.addEventListener("pointercancel",release);btn.addEventListener("pointerleave",release);
}
bindHold("leftBtn","left");
bindHold("rightBtn","right");

const downBtn=document.getElementById("downBtn");
downBtn.addEventListener("pointerdown",e=>{e.preventDefault();input.down=true;if(!player.grounded)triggerGroundPound()});
const releaseDown=e=>{e.preventDefault();input.down=false};
downBtn.addEventListener("pointerup",releaseDown);downBtn.addEventListener("pointercancel",releaseDown);downBtn.addEventListener("pointerleave",releaseDown);

const jumpBtn=document.getElementById("jumpBtn");
jumpBtn.addEventListener("pointerdown",e=>{e.preventDefault();if(!input.jumpHeld)input.jumpPressed=true;input.jumpHeld=true});
function releaseJump(e){e.preventDefault();input.jumpHeld=false;jumpHoldFrames=MAX_JUMP_HOLD}
jumpBtn.addEventListener("pointerup",releaseJump);jumpBtn.addEventListener("pointercancel",releaseJump);jumpBtn.addEventListener("pointerleave",releaseJump);

document.getElementById("continueBtn").addEventListener("click",()=>startStage(Math.min(maxUnlockedStage,4)));
document.getElementById("stageMenuBtn").addEventListener("click",()=>{buildStageGrid();showOnly(stageScreen)});
document.getElementById("settingsBtn").addEventListener("click",()=>{updateSettingsUI();showOnly(settingsScreen)});
document.getElementById("stageBackBtn").addEventListener("click",()=>showOnly(homeScreen));
document.getElementById("settingsBackBtn").addEventListener("click",()=>showOnly(homeScreen));
document.getElementById("fullscreenBtn").addEventListener("click",requestFullscreen);
document.getElementById("homeBtn").addEventListener("click",goHome);
document.getElementById("pauseBtn").addEventListener("click",togglePause);
document.getElementById("shakeToggle").addEventListener("click",()=>{shakeEnabled=!shakeEnabled;localStorage.setItem("jumporiaShake",shakeEnabled?"on":"off");updateSettingsUI()});
document.getElementById("controlOpacityBtn").addEventListener("click",()=>{controlOpacity=controlOpacity>.82?.68:controlOpacity>.7?.9:.78;localStorage.setItem("jumporiaControlOpacity",String(controlOpacity));updateSettingsUI()});
document.getElementById("resetSaveBtn").addEventListener("click",()=>{
  if(confirm("ステージ解放状況と設定をリセットしますか？")){
    localStorage.removeItem("jumpAdventureUnlocked");localStorage.removeItem("jumporiaAllClear");localStorage.removeItem("jumporiaShake");localStorage.removeItem("jumporiaControlOpacity");
    maxUnlockedStage=0;shakeEnabled=true;controlOpacity=.9;refreshCourseLocks();buildStageGrid();updateSettingsUI();
  }
});
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e;document.getElementById("installBtn").classList.remove("hidden")});
document.getElementById("installBtn").addEventListener("click",async()=>{if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();try{await deferredInstallPrompt.userChoice}catch(e){}deferredInstallPrompt=null;document.getElementById("installBtn").classList.add("hidden")});

document.addEventListener("touchmove",e=>{
  if(gameFrame.contains(e.target))e.preventDefault();
},{passive:false});

window.addEventListener("resize",fitGameToViewport,{passive:true});
window.addEventListener("orientationchange",()=>setTimeout(fitGameToViewport,80),{passive:true});
if(window.visualViewport){
  window.visualViewport.addEventListener("resize",fitGameToViewport,{passive:true});
}
document.addEventListener("fullscreenchange",()=>setTimeout(fitGameToViewport,50));

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}

document.getElementById("resumeBtn").addEventListener("click",()=>{
  paused=false;
  pauseBadge.style.display="none";
  document.getElementById("pauseBtn").textContent="Ⅱ";
  fitGameToViewport();
});
document.getElementById("pauseRestartBtn").addEventListener("click",()=>{
  paused=false;
  pauseBadge.style.display="none";
  document.getElementById("pauseBtn").textContent="Ⅱ";
  loadCourse(currentCourse);
});
document.getElementById("pauseHomeBtn").addEventListener("click",()=>{
  pauseBadge.style.display="none";
  document.getElementById("pauseBtn").textContent="Ⅱ";
  goHome();
});

document.getElementById("restartBtn").addEventListener("click",()=>{paused=false;pauseBadge.style.display="none";loadCourse(currentCourse)});
document.getElementById("nextBtn").addEventListener("click",()=>{
  if(!clear){
    message.textContent="🔒 まずこのステージをクリアしよう！";
    return;
  }
  if(currentCourse>=courses.length-1){
    message.textContent="🎉 全ステージクリア！";
    return;
  }
  loadCourse(currentCourse+1);
});
courseSelect.addEventListener("change",()=>{
  const target=Number(courseSelect.value);
  if(target>maxUnlockedStage){
    message.textContent="🔒 まだ解放されていないステージです";
    refreshCourseLocks();
    return;
  }
  loadCourse(target);
});

document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("selectstart",e=>{if(e.target.tagName==="BUTTON")e.preventDefault()});
</script>
