<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;background:#10172c;color:#fff;font-family:Arial,"Yu Gothic",sans-serif;user-select:none}
body{display:flex;justify-content:center}
#app{width:100%;max-width:1200px;padding:8px}
#hud{
width:min(100%,1100px);
min-height:46px;
padding:5px 8px;
margin:0 auto 3px;
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
background:rgba(17,29,57,.92);
border-radius:10px;
box-sizing:border-box;
z-index:20;
}
#title{font-size:18px;white-space:nowrap}
#stats{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:12px;font-size:16px}
#gameFrame{
position:relative;
width:min(100vw,calc((100vh - 86px) * 16 / 9));
height:min(calc(100vh - 86px),calc(100vw * 9 / 16));
max-width:100vw;
max-height:calc(100vh - 86px);
margin:0 auto;
overflow:hidden;
border-radius:10px;
}
canvas{
display:block;
width:100%;
height:100%;
object-fit:contain;
aspect-ratio:16/9;
background:#8fd7ff;
image-rendering:auto;
}
#message{min-height:27px;margin-top:6px;text-align:center;font-weight:900;font-size:16px;color:#ffe96d}
#courseSelect{width:100%;min-height:44px;margin-top:8px;padding:0 12px;border-radius:10px;border:2px solid #3559a5;background:#172447;color:#fff;font-size:16px;font-weight:bold}
#controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
#movement{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ctrl{min-height:68px;border:none;border-radius:15px;font-size:26px;font-weight:900;color:#fff;background:linear-gradient(#3b80e3,#1956ad);border-bottom:6px solid #0b377e;box-shadow:0 5px 10px rgba(0,0,0,.25);touch-action:none}
.ctrl:active{transform:translateY(4px);border-bottom-width:2px}
#jumpBtn{background:linear-gradient(#ff9c31,#e75c16);border-bottom-color:#9c320b}
#downBtn{background:linear-gradient(#7d65e8,#5140aa);border-bottom-color:#31236f}
#bottomButtons{display:flex;gap:8px;margin-top:9px}
.smallBtn{flex:1;min-height:44px;border:0;border-radius:11px;background:#27385e;color:#fff;font-size:15px;font-weight:bold}
#help{padding-top:7px;text-align:center;color:#aabbe0;font-size:12px}
#courseSelect option:disabled{color:#7d89a8;background:#18223d}
.hidden{display:none!important}
.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 50% 20%,rgba(69,145,255,.25),transparent 35%),linear-gradient(180deg,#09142a,#10172c 55%,#101526)}
.menuCard{width:min(92vw,720px);max-height:92vh;overflow:auto;border:2px solid #456fc3;border-radius:24px;padding:24px;background:rgba(20,33,65,.97);box-shadow:0 22px 60px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.12)}
.logo{font-size:clamp(42px,8vw,82px);font-weight:1000;letter-spacing:3px;text-align:center;line-height:1;margin:8px 0 6px;background:linear-gradient(#fff7a8,#ffbf38 45%,#ff6d2e);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{text-align:center;color:#bcd2ff;font-weight:800;margin:0 0 22px}
.menuGrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.menuBtn{min-height:58px;border:0;border-radius:15px;padding:10px 14px;color:#fff;font-size:17px;font-weight:900;background:linear-gradient(#397ae0,#1f4eaa);border-bottom:5px solid #123775;box-shadow:0 6px 14px rgba(0,0,0,.25)}
.menuBtn:active{transform:translateY(3px);border-bottom-width:2px}
.menuBtn.primary{grid-column:1/-1;background:linear-gradient(#ffad3c,#ef651f);border-bottom-color:#a33b10;font-size:21px}
.menuBtn.secondary{background:linear-gradient(#445678,#293754);border-bottom-color:#18233a}
.panelTitle{font-size:28px;font-weight:1000;margin:0 0 15px;text-align:center}
.stageGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stageCard{min-height:96px;border:2px solid #4668a5;border-radius:15px;padding:12px;background:#172647;color:#fff;text-align:left;font-weight:900}
.stageCard.locked{filter:saturate(.3);opacity:.52}
.stageCard .small{display:block;color:#a9c1ec;font-size:12px;margin-top:5px}
.settingRow{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px 4px;border-bottom:1px solid rgba(255,255,255,.1);font-weight:900}
.toggleBtn{min-width:100px;min-height:40px;border:0;border-radius:12px;background:#315b9d;color:#fff;font-weight:900}
#topGameButtons{display:flex;gap:6px;align-items:center}
.iconBtn{width:42px;height:38px;border:0;border-radius:10px;background:#27385e;color:#fff;font-size:18px;font-weight:900}
#bossHud{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:15;width:min(66vw,560px);padding:8px 12px;border-radius:12px;background:rgba(18,20,37,.88);border:2px solid #b75f83;display:none}
#bossName{text-align:center;font-size:13px;font-weight:1000;margin-bottom:5px}
#bossBar{height:14px;background:#47253a;border-radius:20px;overflow:hidden}
#bossBarFill{height:100%;width:100%;background:linear-gradient(90deg,#ffca56,#ff4f7d);transition:width .2s}
#pauseBadge{
position:absolute;
inset:0;
z-index:30;
display:none;
align-items:center;
justify-content:center;
background:rgba(5,10,25,.62);
backdrop-filter:blur(4px);
}
@media(max-width:600px){.menuCard{padding:17px}.menuGrid,.stageGrid{grid-template-columns:1fr}}
@media(max-width:600px){
  #app{padding:4px}
  #hud{padding:6px 8px}
  #title{font-size:13px}
  #stats{gap:6px;font-size:12px}
  .ctrl{min-height:60px;font-size:22px}
  #controls{gap:7px}
}
@media(orientation:landscape) and (max-height:650px){
  html,body{height:100%;overflow:hidden}
  body{align-items:center}
  #app{
    width:100vw;
    max-width:none;
    height:100vh;
    padding:3px;
    position:relative;
  }
  #hud{
    position:absolute;
    z-index:10;
    top:5px;
    left:50%;
    transform:translateX(-50%);
    width:min(70vw,850px);
    margin:0;
    padding:5px 10px;
    background:rgba(18,31,61,.88);
    backdrop-filter:blur(5px);
  }
  #gameFrame{
    width:100%;
    height:100%;
    border-radius:8px;
  }
  canvas{
    width:100%;
    height:100%;
    aspect-ratio:auto;
    object-fit:contain;
    background:#63c8ff;
  }
  #message{
    position:absolute;
    z-index:11;
    top:47px;
    left:50%;
    transform:translateX(-50%);
    margin:0;
    min-height:22px;
    font-size:13px;
    pointer-events:none;
    text-shadow:0 2px 4px #000;
  }
  #courseSelect,
  #bottomButtons,
  #help{display:none}
  #controls{
    position:absolute;
    z-index:20;
    inset:0;
    pointer-events:none;
    display:block;
    margin:0;
  }
  #movement{
    position:absolute;
    left:10px;
    bottom:10px;
    width:260px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:7px;
    pointer-events:auto;
  }
  #jumpBtn{
    position:absolute;
    right:16px;
    bottom:16px;
    width:135px;
    height:72px;
    pointer-events:auto;
  }
  .ctrl{
    min-height:62px;
    opacity:.9;
    font-size:22px;
    border-bottom-width:4px;
  }
  #title{font-size:13px}
  #stats{font-size:12px}
}
</style>

function jSiteChooseQuality(){
  const cores=navigator.hardwareConcurrency||4;
  const mem=navigator.deviceMemory||4;
  const mobile=matchMedia("(pointer:coarse)").matches || innerWidth<900;
  if(mobile){
    if(cores<=4||mem<=4)return .78;
    return .90;
  }
  if(cores>=8&&mem>=8)return 1.00;
  if(cores>=6)return .93;
  return .84;
}

function resizeCanvas(){
  // High-quality adaptive rendering. Logical coordinates remain 1920x1080.
  jSiteQualityScale=jSiteChooseQuality();
  const pixelCapScale=Math.sqrt(26500000/(WIDTH*HEIGHT));
  const dpr=window.devicePixelRatio||1;
  const base=Math.max(dpr*1.06,1.60);
  jSiteRenderScale=Math.min(base*jSiteQualityScale,2.95,pixelCapScale);

  canvas.width=Math.round(WIDTH*jSiteRenderScale);
  canvas.height=Math.round(HEIGHT*jSiteRenderScale);
  ctx.setTransform(jSiteRenderScale,0,0,jSiteRenderScale,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality="high";
}

/* =========================

function makeChallengeCourse(name,type,world,variant,bossStage=false){
  if(bossStage){
    const width=world===2?3900:4300;
    return {
      name,type:"fortress",world,difficulty:world===2?"HARD":"EXPERT",
      subtitle:world===2?"灼熱の要塞・強化ボス":"終焉の天空城・最終ボス",
      width,startX:150,boss:true,bossLevel:world,
      platforms:[
        [0,760,width,140],
        [520,570,260,38],[1010,470,250,38],[1490,600,250,38],
        [1960,470,260,38],[2440,580,250,38],[width-1180,430,270,38]
      ],
      blocks:[
        [560,420,"power"],[624,420,"shield"],[1060,320,"coin"],[1124,320,"star"],
        [1540,450,"boots"],[2020,320,"speed"],[2084,320,"coin"],
        [2490,430,"magnet"],[width-1120,280,"star"]
      ],
      pipes:[[300,620,120,140,"solid"],[1280,600,120,160,"solid"],[2230,610,120,150,"solid"]],
      enemies:[
        [760,700,"shell",500,1100],[1180,700,"spike",1000,1450],
        [1700,700,"walker",1500,2100],[2180,390,"flyer",1940,2420],
        [2580,700,"shell",2400,width-1050],[width-1280,700,"spike",width-1450,width-980]
      ],
      coins:[[450,650],[900,650],[1380,650],[1850,650],[2320,650],[width-1320,650]]
    };
  }

  const level=world===2?2:3;
  const segCount=world===2?9:10;
  const baseSeg=world===2?760:690;
  const baseGap=world===2?155:185;
  let x=0;
  const platforms=[],blocks=[],pipes=[],enemies=[],coins=[];
  for(let i=0;i<segCount;i++){
    const segW=baseSeg+((i*97+variant*53)%190);
    const gap=baseGap+((i*41+variant*29)%(world===2?70:95));
    platforms.push([x,760,segW,140]);

    // Elevated route becomes tighter and higher with difficulty.
    const ey=world===2 ? 540-((i+variant)%3)*65 : 510-((i+variant)%4)*72;
    const ew=world===2?230:205;
    if(i>0){
      platforms.push([x+Math.min(170,segW-300),ey,ew,36]);
      if(world===3 && i%2===1) platforms.push([x+segW-250,ey-150,190,34]);
    }

    // Blocks above safe landing areas.
    if(i>0){
      const bx=x+Math.min(210,segW-250);
      const choices=["coin","power","brick","shield","star","magnet","boots","speed"];
      blocks.push([bx,ey-150,choices[(i+variant+level)%choices.length]]);
      blocks.push([bx+64,ey-150,(i%3===0?"brick":"coin")]);
    }

    // Pipes never sit over gaps.
    if(i>0 && i%2===0 && segW>600){
      const ph=130+((i+variant)%3)*25;
      pipes.push([x+segW-190,760-ph,115,ph,i===4?"warp":"solid",i===4?Math.max(900,x-600):0]);
    }

    // More enemies in later worlds.
    const min=x+60,max=x+segW-60;
    const e1=i%4===0?"spike":i%3===0?"shell":"walker";
    enemies.push([x+segW*.56,700,e1,min,max]);
    if(i>1){
      if(world===3 || i%2===0) enemies.push([x+segW*.78,ey-60,"flyer",x+100,x+segW-100]);
      if(world===3 && i%3===1) enemies.push([x+segW*.28,700,"shell",min,max]);
    }

    coins.push([x+segW-85,650]);
    x+=segW+gap;
  }
  // Final safe runway for the goal.
  platforms.push([x,760,900,140]);
  coins.push([x+160,650],[x+320,650],[x+480,650]);

  return {
    name,type,world,difficulty:world===2?"HARD":"EXPERT",
    subtitle:
      world===2
        ? ["風の峡谷","深層クリスタル洞窟","灼熱の夕景","高空連続ジャンプ"][variant]
        : ["嵐の荒野","奈落の鉱洞","紅蓮の断崖","極天空アスレチック"][variant],
    width:x+900,startX:120,platforms,blocks,pipes,enemies,coins
  };
}

function compactBlockRows(list){
  const rows=new Map();
  for(const b of list){
    const key=Math.round(b.y/8)*8;
    if(!rows.has(key))rows.set(key,[]);
    rows.get(key).push(b);
  }
  for(const row of rows.values()){
    row.sort((a,b)=>a.x-b.x);
    for(let i=1;i<row.length;i++){
      const prev=row[i-1],cur=row[i];
      const gap=cur.x-(prev.x+prev.w);
      if(gap>0&&gap<=46)cur.x=prev.x+prev.w;
    }
  }
  return list;
}

function snapPipesToSupportedPlatforms(){
  if(inSecret)return;
  for(const p of pipes){
    const cx=p.x+p.w/2;
    // find a platform whose horizontal span supports most of the pipe and whose top is near the pipe bottom
    const candidates=platforms.filter(pl=>
      p.x>=pl.x-8 &&
      p.x+p.w<=pl.x+pl.w+8 &&
      Math.abs((p.y+p.h)-pl.y)<150
    );
    if(candidates.length){
      candidates.sort((a,b)=>Math.abs((p.y+p.h)-a.y)-Math.abs((p.y+p.h)-b.y));
      const pl=candidates[0];
      p.y=pl.y-p.h;
    }
  }
}

function setupCheckpoint(){
  checkpoint={enabled:currentCourse>=1,active:false,x:0,y:620,lastCenter:null};
  checkpointFlash=0;
  if(!checkpoint.enabled)return;
  const target=currentWorldWidth*.5;
  const groundCandidates=platforms.filter(p=>p.w>=260 && p.y>=650 && p.y<=820);
  let best=null,bestDist=Infinity;
  for(const p of groundCandidates){
    const px=Math.max(p.x+90,Math.min(target,p.x+p.w-120));
    const d=Math.abs(px-target);
    if(d<bestDist){bestDist=d;best={p,px}}
  }
  if(!best){
    const all=platforms.filter(p=>p.w>=220);
    for(const p of all){
      const px=p.x+p.w*.5,d=Math.abs(px-target);
      if(d<bestDist){bestDist=d;best={p,px}}
    }
  }
  if(best){
    checkpoint.x=best.px;
    checkpoint.y=best.p.y-player.normalH;
  }
}
function updateCheckpoint(){
  if(!checkpoint.enabled||checkpoint.active||inSecret)return;

  const center=player.x+player.w*.5;

  if(checkpoint.lastCenter===null){
    checkpoint.lastCenter=center;
  }

  // Activate only when the player actually crosses the flag from left to right.
  const crossed=checkpoint.lastCenter<checkpoint.x && center>=checkpoint.x;

  if(crossed){
    checkpoint.active=true;
    checkpointFlash=180;
    addScore(500);
    grantOneUp("CHECKPOINT!");
    screenShake=shakeEnabled?5:0;
    message.textContent="🚩 CHECKPOINT SAVED!";
  }

  checkpoint.lastCenter=center;
  if(checkpointFlash>0)checkpointFlash--;
}

function overlap(a,b){
  return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}
function addScore(v){score+=v;scoreText.textContent=score}

function growPlayer(){
  if(player.big)return;
  // Power state uses a constant gameplay hitbox.
  // The character becomes visually larger, while collision height stays compact,
  // preventing narrow block/ground gaps from trapping the player.
  const bottom=player.y+player.h;
  player.big=true;
  player.h=player.normalH;
  player.y=bottom-player.h;
  invincible=Math.max(invincible,36);
}

function hitBlock(block){
  if(block.broken)return;
  if(block.type==="brick"){
    if(player.big||player.groundPound){
      block.broken=true; addScore(200); screenShake=10; message.textContent="💥 BLOCK BREAK!";
    }else{
      block.bump=12; message.textContent="硬いブロック！";
    }
    return;
  }
  if(block.used)return;
  block.used=true; block.bump=12; addScore(100); spawnItem(block);
}

function damage(){
  if(invincible>0||player.star)return;
  if(shieldTimer>0){
    shieldTimer=0;
    invincible=100;
    screenShake=shakeEnabled?12:0;
    message.textContent="🛡️ SHIELD BLOCK!";
    return;
  }
  if(player.big){
    const bottom=player.y+player.h;
    player.big=false; player.h=player.normalH; player.y=bottom-player.h;
    invincible=120; message.textContent="POWER DOWN!"; return;
  }
  lives--; lifeText.textContent=lives;
  if(lives<=0){running=false;message.textContent="GAME OVER";return}
  resetPlayer();
}
function resetPlayer(){
  if(checkpoint.enabled&&checkpoint.active&&!inSecret){
    player.x=Math.max(0,checkpoint.x-30);
    player.y=checkpoint.y;
    cameraX=Math.max(0,Math.min(currentWorldWidth-WIDTH,checkpoint.x-WIDTH*.32));

  }

  player.groundPound=false; player.groundPoundReady=true;
  jumpHoldFrames=0; invincible=100;

function solidObjects(){
  return [
    ...blocks.filter(b=>!b.broken).map(b=>({...b,kind:"block"})),
    ...pipes.map(p=>({...p,kind:"pipe"}))
  ];
}

function resolveHorizontal(){
  for(const o of solidObjects()){
    if(!overlap(player,o))continue;
    if(player.vx>0)player.x=o.x-player.w;
    else if(player.vx<0)player.x=o.x+o.w;
    player.vx=0;
  }
}

function tryWarp(){
  if(!input.down||!player.grounded)return;
  for(const p of pipes){
    if((p.type!=="warp"&&p.type!=="exit")||p.cooldown>0)continue;
    const centered=player.x+player.w/2>p.x+15&&player.x+player.w/2<p.x+p.w-15;
    const onTop=Math.abs((player.y+player.h)-p.y)<8;
    if(!centered||!onTop)continue;

    p.cooldown=90;

    if(p.type==="warp"){
      enterSecretArea(p.target);
    }else if(p.type==="exit"){
      exitSecretArea();
    }
    return;
  }
}

function triggerGroundPound(){
  if(player.grounded||player.groundPound||!player.groundPoundReady)return;
  player.groundPound=true; player.groundPoundReady=false; player.vx*=0.3; player.vy=24;
  message.textContent="💥 HIP DROP!";
}

function groundPoundImpact(){
  screenShake=16; addScore(100);
  const cx=player.x+player.w/2;
  for(const e of enemies){
    if(!e.alive)continue;
    if(Math.abs((e.x+e.w/2)-cx)<110&&Math.abs((e.y+e.h)-(player.y+player.h))<100){
      if(e.type==="spike")continue;
      e.alive=false;registerEnemyDefeat(); addScore(250);
    }
  }
  for(const b of blocks){
    if(b.broken)continue;
    if(b.type==="brick"&&Math.abs((b.x+b.w/2)-cx)<90&&b.y>player.y){
      b.broken=true; addScore(200);
    }
  }
}

function updatePlayer(){
  const speed=player.star?12:(speedTimer>0?player.speed*1.38:player.speed);

  if(!player.groundPound){
    if(input.left){player.vx=-speed;player.dir=-1}
    else if(input.right){player.vx=speed;player.dir=1}
    else{player.vx*=.78;if(Math.abs(player.vx)<.15)player.vx=0}
  }

  player.x+=player.vx;
  player.x=Math.max(0,Math.min(currentWorldWidth-player.w,player.x));
  resolveHorizontal();

  if(input.down&&!player.grounded)triggerGroundPound();

  const oldY=player.y;

  if(!player.groundPound){
    player.vy+=1.42;
    if(input.jumpHeld&&player.vy<0&&jumpHoldFrames<MAX_JUMP_HOLD){
      player.vy-=.62;jumpHoldFrames++;
    }
  }else{
    player.vy=Math.max(player.vy,24);
  }

  player.y+=player.vy;
  player.grounded=false;

  const floorObjects=[
    ...platforms.map(p=>({...p,kind:"platform"})),
    ...blocks.filter(b=>!b.broken).map(b=>({...b,kind:"block"})),
    ...pipes.map(p=>({...p,kind:"pipe"}))
  ];

  for(const o of floorObjects){
    const horizontal=player.x+player.w>o.x&&player.x<o.x+o.w;
    if(!horizontal)continue;

    const oldBottom=oldY+player.h, newBottom=player.y+player.h;
    if(player.vy>=0&&oldBottom<=o.y+10&&newBottom>=o.y){
      player.y=o.y-player.h; player.vy=0; player.grounded=true; jumpHoldFrames=0;

      if(player.groundPound){
        player.groundPound=false;
        groundPoundImpact();
      }
      player.groundPoundReady=true;
    }

    if(o.kind==="block"){
      const oldTop=oldY,newTop=player.y;
      if(player.vy<0&&oldTop>=o.y+o.h-10&&newTop<=o.y+o.h){
        player.y=o.y+o.h; player.vy=2; jumpHoldFrames=MAX_JUMP_HOLD;
        const original=blocks.find(b=>b.x===o.x&&b.y===o.y);
        if(original)hitBlock(original);
      }
    }
  }

  if(input.jumpPressed&&player.grounded&&!player.groundPound){
    player.vy=jumpBoostTimer>0?player.jumpPower-4:player.jumpPower; player.grounded=false; jumpHoldFrames=0; player.groundPoundReady=true;
  }
  input.jumpPressed=false;

  tryWarp();

  if(player.y>HEIGHT+180)damage();

  updateCheckpoint();
}

function updateCoins(){
  for(const c of worldCoins){
    if(c.collected)continue;
    c.rot+=.12;
    let dx=player.x+player.w/2-c.x,dy=player.y+player.h/2-c.y;
    let distance=Math.hypot(dx,dy);
    if(magnetTimer>0&&distance<340&&distance>1){
      c.x+=dx/distance*8.5;
      c.y+=dy/distance*8.5;
      dx=player.x+player.w/2-c.x;
      dy=player.y+player.h/2-c.y;
      distance=Math.hypot(dx,dy);
    }
    if(distance<44){
      c.collected=true;coins++;coinText.textContent=coins;addScore(100);message.textContent="🪙 COIN!";
    }
  }
}

function updateItems(){
  for(const item of items){
    if(!item.active)continue;
    item.vy+=.75; item.x+=item.vx; item.y+=item.vy;

    const floors=[...platforms,...pipes,...blocks.filter(b=>!b.broken)];
    for(const p of floors){
      if(item.x+item.w>p.x&&item.x<p.x+p.w&&item.y+item.h>p.y&&item.y+item.h<p.y+30&&item.vy>=0){
        item.y=p.y-item.h;
        if(item.type==="star")item.vy=-10;else item.vy=0;
      }
    }
    if(overlap(player,item)){
      item.active=false;
      if(item.type==="power"){growPlayer();addScore(1000);message.textContent="🍄 POWER UP!"}
      else if(item.type==="star"){player.star=true;starTimer=600;addScore(1500);message.textContent="⭐ STAR POWER!"}
      else if(item.type==="shield"){shieldTimer=900;addScore(800);message.textContent="🛡️ SHIELD 15s!"}
      else if(item.type==="magnet"){magnetTimer=900;addScore(800);message.textContent="🧲 COIN MAGNET 15s!"}
      else if(item.type==="boots"){jumpBoostTimer=900;addScore(800);message.textContent="👢 HIGH JUMP 15s!"}
      else if(item.type==="speed"){speedTimer=900;addScore(800);message.textContent="⚡ SPEED UP 15s!"}
    }
  }
}

function updateEnemies(){
  for(const e of enemies){
    if(!e.alive)continue;

    if(e.type==="flyer"){
      e.x+=e.vx;
      e.phase+=.06;
      e.y=e.baseY+Math.sin(e.phase)*45;
    }else{
      e.x+=e.vx;
    }

    if(e.x<e.min||e.x>e.max)e.vx*=-1;

    for(const p of pipes){
      if(overlap(e,p))e.vx*=-1;
    }

    if(!overlap(player,e))continue;

    if(player.star){
      e.alive=false;registerEnemyDefeat();addScore(300);continue;
    }

    if(player.groundPound){
      if(e.type==="spike"){
        damage();
      }else{
        e.alive=false;registerEnemyDefeat();addScore(300);player.vy=-8;player.groundPound=false;
      }
      continue;
    }

    const playerBottom=player.y+player.h;

    if(player.vy>2&&playerBottom<e.y+32&&e.type!=="spike"){
      if(e.type==="shell"&&!e.shellMoving){
        e.shellMoving=true;e.h=34;e.y+=24;e.vx=0;player.vy=-12;addScore(200);message.textContent="SHELL STOP!";
      }else if(e.type==="shell"&&e.shellMoving){
        e.vx=player.dir*8;player.vy=-12;addScore(200);message.textContent="SHELL KICK!";
      }else{
        e.alive=false;registerEnemyDefeat();player.vy=-12;addScore(200);message.textContent="NICE!";
      }
    }else{
      if(e.type==="shell"&&e.shellMoving&&Math.abs(e.vx)<1)e.vx=player.dir*8;
      else damage();
    }
  }

  for(const shell of enemies.filter(e=>e.alive&&e.type==="shell"&&e.shellMoving&&Math.abs(e.vx)>4)){
    for(const e of enemies){
      if(!e.alive||e===shell)continue;
      if(overlap(shell,e)){
        e.alive=false;registerEnemyDefeat();addScore(300);shell.vx*=.96;
      }
    }
  }
}

function updateBoss(){
  if(!boss||!boss.alive)return;
  if(boss.hitTimer>0)boss.hitTimer--;
  boss.phase++;boss.chargeTimer++;

  if(boss.grounded&&boss.chargeTimer>150){
    boss.chargeTimer=0;
    boss.vx=(player.x<boss.x?-1:1)*5.4;
    if(Math.random()<.55)boss.vy=-13;
  }

  boss.vy+=0.8;
  boss.x+=boss.vx;
  boss.y+=boss.vy;
  boss.grounded=false;

  const floorY=760-boss.h;
  if(boss.y>=floorY){boss.y=floorY;boss.vy=0;boss.grounded=true}
  if(boss.x<boss.arenaMin){boss.x=boss.arenaMin;boss.vx=Math.abs(boss.vx)}
  if(boss.x+boss.w>boss.arenaMax){boss.x=boss.arenaMax-boss.w;boss.vx=-Math.abs(boss.vx)}
  boss.dir=boss.vx>=0?1:-1;

  if(overlap(player,boss)&&boss.hitTimer<=0){
    const stomp=player.vy>2&&(player.y+player.h)<boss.y+75;
    if(player.star||player.groundPound||stomp){
      boss.hp--;boss.hitTimer=45;boss.vx=(boss.x<player.x?-1:1)*6;boss.vy=-7;
      player.vy=-15;player.groundPound=false;screenShake=shakeEnabled?16:0;
      addScore(1000);bossBarFill.style.width=`${Math.max(0,boss.hp/boss.maxHp*100)}%`;
      message.textContent=`BOSS HIT! ${boss.hp}/${boss.maxHp}`;
      if(boss.hp<=0){
        boss.alive=false;bossHud.style.display="none";addScore(10000);
        running=false;clear=true;
        const finalBoss=currentCourse>=courses.length-1;
        if(!finalBoss && maxUnlockedStage<currentCourse+1){
          maxUnlockedStage=currentCourse+1;
          localStorage.setItem("jumpAdventureUnlocked",String(maxUnlockedStage));
          refreshCourseLocks();
        }
        if(finalBoss)localStorage.setItem("jumporiaAllClear","1");
        message.textContent=finalBoss?"👑 FINAL BOSS DEFEATED! ALL CLEAR!":"👑 BOSS DEFEATED! NEXT WORLD UNLOCKED!";
        goalScore.textContent=`SCORE ${score}   COINS ${coins}`;
        goalNextBtn.style.display=finalBoss?"none":"block";
        document.getElementById("goalTitle").textContent=finalBoss?"ALL CLEAR!":`WORLD ${courses[currentCourse].world} CLEAR!`;
        goalOverlay.classList.remove("hidden");
      }
    }else damage();
  }
}

function jHQMakeTexture(kind){
  const c=document.createElement("canvas");
  c.width=192;c.height=192;
  const g=c.getContext("2d");
  g.imageSmoothingEnabled=true;

  if(kind==="dirt"){
    const bg=g.createLinearGradient(0,0,0,192);
    bg.addColorStop(0,"#b96f3b");
    bg.addColorStop(.42,"#8d5031");
    bg.addColorStop(1,"#54301f");
    g.fillStyle=bg;g.fillRect(0,0,192,192);

    // layered stones / soil chips
    for(let i=0;i<42;i++){
      const x=(i*47)%192,y=(i*73)%192;
      const r=3+(i%5);
      g.fillStyle=i%3===0?"#d89250":i%3===1?"#754329":"#623621";
      g.beginPath();g.ellipse(x,y,r*1.5,r,.35,0,Math.PI*2);g.fill();
      if(i%4===0){
        g.fillStyle="#e5a36a";
        g.beginPath();g.arc(x-1,y-1,1.5,0,Math.PI*2);g.fill();
      }
    }
    // subtle diagonal strata
    g.strokeStyle="rgba(72,39,25,.32)";

const jHQPatterns={};

function jHQPattern(kind){

function drawPlatforms(){

    if(type==="cave"){

      grass.addColorStop(0,"#c4ff72");
      grass.addColorStop(.18,"#8feb4f");

        }
      }
    }
  }

function drawBlocks(){
  const active=blocks.filter(b=>!b.broken);

  function hasNeighbor(b,dx){
    return active.some(o=>o!==b&&Math.abs(o.y-b.y)<2&&Math.abs(o.x-(b.x+dx))<2);
  }

  for(const b of active){
    const bumpY=b.bump>0?-Math.sin((12-b.bump)/12*Math.PI)*16:0;
    const x=b.x,y=b.y+bumpY;
    const left=hasNeighbor(b,-b.w),right=hasNeighbor(b,b.w);

    if(b.type==="brick"){
      const g=ctx.createLinearGradient(x,y,x,y+b.h);
      g.addColorStop(0,"#e18a48");g.addColorStop(.48,"#b95c34");g.addColorStop(1,"#773720");
      ctx.fillStyle=g;ctx.fillRect(x,y,b.w,b.h);

      // individual brick faces
      ctx.strokeStyle="#6b321f";ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(x,y+31);ctx.lineTo(x+b.w,y+31);
      ctx.moveTo(x+32,y);ctx.lineTo(x+32,y+31);
      ctx.moveTo(x+16,y+31);ctx.lineTo(x+16,y+b.h);
      ctx.moveTo(x+48,y+31);ctx.lineTo(x+48,y+b.h);
      ctx.stroke();

      ctx.strokeStyle="#f1a565";ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(x+5,y+5);ctx.lineTo(x+27,y+5);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x+36,y+5);ctx.lineTo(x+58,y+5);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x+5,y+36);ctx.lineTo(x+11,y+36);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x+21,y+36);ctx.lineTo(x+43,y+36);ctx.stroke();

      if(!left){ctx.fillStyle="#8b4027";ctx.fillRect(x,y,4,b.h)}
      if(!right){ctx.fillStyle="#59291b";ctx.fillRect(x+b.w-4,y,4,b.h)}
      continue;
    }

    if(b.used){
      const g=ctx.createLinearGradient(x,y,x,y+b.h);
      g.addColorStop(0,"#c8a379");g.addColorStop(.52,"#98704f");g.addColorStop(1,"#63432e");
      ctx.fillStyle=g;ctx.fillRect(x,y,b.w,b.h);
      ctx.strokeStyle="#50311f";ctx.lineWidth=3;ctx.strokeRect(x+1.5,y+1.5,b.w-3,b.h-3);
      ctx.strokeStyle="#e3c59d";ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(x+8,y+8);ctx.lineTo(x+b.w-8,y+8);ctx.stroke();
      continue;
    }

    // Original JUMPORIA treasure block: gold plate + blue jewel corners.
    const g=ctx.createLinearGradient(x,y,x,y+b.h);
    g.addColorStop(0,"#fff59a");g.addColorStop(.18,"#ffe14f");
    g.addColorStop(.56,"#eda21c");g.addColorStop(1,"#b45f08");
    ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x,y,b.w,b.h,8);ctx.fill();

    ctx.strokeStyle="#7b4308";ctx.lineWidth=4;ctx.stroke();
    ctx.strokeStyle="#fff4a6";ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x+9,y+7);ctx.lineTo(x+b.w-10,y+7);ctx.stroke();

    // inset face
    ctx.fillStyle="#f4b82b";
    ctx.beginPath();ctx.roundRect(x+8,y+10,b.w-16,b.h-18,6);ctx.fill();
    ctx.strokeStyle="#c67c0c";ctx.lineWidth=2;ctx.stroke();

    // corner jewel rivets
    for(const px of [10,b.w-10]){
      for(const py of [11,b.h-11]){
        const jewel=ctx.createRadialGradient(x+px-1,y+py-1,1,x+px,y+py,5);
        jewel.addColorStop(0,"#bdf7ff");jewel.addColorStop(.45,"#4fc4e4");jewel.addColorStop(1,"#126a9c");
        ctx.fillStyle=jewel;ctx.beginPath();ctx.arc(x+px,y+py,4,0,Math.PI*2);ctx.fill();
      }
    }

    const symbol=b.type==="shield"?"◆":b.type==="magnet"?"U":b.type==="boots"?"⇧":b.type==="speed"?"⚡":"?";
    ctx.fillStyle="#fffdf4";
    ctx.font=b.type==="speed"?"900 30px Arial":"900 42px Arial";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.strokeStyle="#7f4809";ctx.lineWidth=7;
    ctx.strokeText(symbol,x+b.w/2,y+b.h/2+3);
    ctx.fillText(symbol,x+b.w/2,y+b.h/2+3);
  }

  ctx.textAlign="left";ctx.textBaseline="alphabetic";
}

function drawUltraDetailPass(){
  ctx.save();
  // subtle atmospheric depth
  const haze=ctx.createLinearGradient(0,0,0,HEIGHT);
  haze.addColorStop(0,"rgba(255,255,255,.035)");
  haze.addColorStop(.55,"rgba(255,255,255,0)");
  haze.addColorStop(1,"rgba(10,20,40,.045)");
  ctx.fillStyle=haze;ctx.fillRect(0,0,WIDTH,HEIGHT);

  // tiny foreground grass/stone details near ground
  if(!inSecret){
    const base=Math.floor(cameraX/90)*90;
    for(let wx=base;wx<cameraX+WIDTH+100;wx+=90){
      const x=wx-cameraX;
      const seed=Math.abs(Math.sin(wx*0.017));
      if(courses[currentCourse].type==="grass"||courses[currentCourse].type==="sunset"){
        ctx.strokeStyle=`rgba(35,112,58,${.18+seed*.12})`;
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(x,758);ctx.lineTo(x-5,744-seed*8);
        ctx.moveTo(x+2,758);ctx.lineTo(x+8,741-seed*6);
        ctx.stroke();
      }else if(courses[currentCourse].type==="fortress"){
        ctx.fillStyle="rgba(255,130,72,.12)";
        ctx.beginPath();ctx.arc(x,748,2+seed*2,0,Math.PI*2);ctx.fill();
      }
    }
  }
  ctx.restore();
}

function fitGameToViewport(){
  const hudHeight=44;
  const vv=window.visualViewport;
  const vw=Math.max(1,Math.floor(vv?vv.width:window.innerWidth));
  const vh=Math.max(1,Math.floor(vv?vv.height:window.innerHeight));
  const safeW=Math.max(160,vw-4);
  const safeH=Math.max(100,vh-hudHeight-4);
  const ratio=WIDTH/HEIGHT;

  let frameW=safeW;
  let frameH=frameW/ratio;
  if(frameH>safeH){
    frameH=safeH;
    frameW=frameH*ratio;
  }

  frameW=Math.max(1,Math.floor(frameW));
  frameH=Math.max(1,Math.floor(frameH));

  gameFrame.style.width=frameW+"px";
  gameFrame.style.height=frameH+"px";
  gameFrame.style.top=(hudHeight+2)+"px";
  gameFrame.style.left="50%";
  gameFrame.style.transform="translateX(-50%)";
}

/* JUMPORIA SITE SMOOTH LOOP v35
   - Physics fixed at 60 Hz, so 60/90/120/144 Hz monitors do not change game speed.
   - Rendering still follows requestAnimationFrame for smooth display refresh.
   - Long tab stalls are clamped to avoid giant physics jumps. */
let jSiteLastTime=performance.now();
let jSiteAccumulator=0;
const J_SITE_STEP=1000/60;
let jSiteFps=60,jSiteFrames=0,jSiteFpsStamp=performance.now();

function loop(now=performance.now()){
  let dt=now-jSiteLastTime;
  jSiteLastTime=now;
  if(dt<0)dt=0;
  if(dt>100)dt=100;
  jSiteAccumulator+=dt;

  let steps=0;
  while(jSiteAccumulator>=J_SITE_STEP && steps<5){
    update();
    jSiteAccumulator-=J_SITE_STEP;
    steps++;
  }
  if(steps===5)jSiteAccumulator=0;

  draw();

  jSiteFrames++;
  if(now-jSiteFpsStamp>=1000){
    jSiteFps=jSiteFrames*1000/(now-jSiteFpsStamp);
    jSiteFrames=0;
    jSiteFpsStamp=now;
  }
  requestAnimationFrame(loop);
}

  if(e.key==="ArrowDown"||k==="s"){input.down=true;if(!player.grounded)triggerGroundPound();e.preventDefault()}

    if(x>WIDTH+80||x+p.w<-80||p.w<40)continue;

    ctx.fillStyle=c.top;
    ctx.fillRect(x,p.y,p.w,Math.min(15,p.h));

    if(p.h>18){
      ctx.fillStyle=c.edge;
      ctx.fillRect(x,p.y+12,p.w,Math.min(10,p.h-12));
    }

    const startY=p.y+24;
    for(let yy=startY;yy<p.y+p.h-10;yy+=36){
      for(let xx=x+8+(((yy-startY)/36)%2)*20;xx<x+p.w-12;xx+=50){
        ctx.fillStyle=((Math.floor((xx-x)/50)+Math.floor((yy-startY)/36))%2===0)?c.dirt:c.rock;
        ctx.beginPath();
        ctx.moveTo(xx,yy);
        ctx.lineTo(xx+19,yy-7);
        ctx.lineTo(xx+38,yy+2);
        ctx.lineTo(xx+20,yy+13);
        ctx.closePath();
        ctx.fill();
      }
    }

    if(type!=="cave"&&type!=="fortress"){
      ctx.strokeStyle=c.light;
      ctx.lineWidth=2.4;
      for(let gx=x+8;gx<x+p.w-6;gx+=16){
        const h=5+((Math.floor(gx)%4)*2);
        ctx.beginPath();
        ctx.moveTo(gx,p.y+4);
        ctx.lineTo(gx-4,p.y-h);
        ctx.stroke();
      }
    }

    if(p.h<=60){
      ctx.fillStyle=c.rock;
      ctx.fillRect(x,p.y+p.h-7,p.w,7);
    }
  }
  ctx.restore();
}

function jcDrawBlockUpgrade(){
  ctx.save();
  for(const b of blocks){
    if(b.broken)continue;
    const x=b.x-cameraX,y=b.y+(b.bump||0);
    if(x<-80||x>WIDTH+80)continue;

    ctx.strokeStyle="#fff3b0";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(x+7,y+7);
    ctx.lineTo(x+b.w-8,y+7);
    ctx.stroke();

    ctx.strokeStyle="#6a3f1f";
    ctx.beginPath();
    ctx.moveTo(x+7,y+b.h-7);
    ctx.lineTo(x+b.w-8,y+b.h-7);
    ctx.stroke();

    ctx.fillStyle="#fff0a5";
    for(const [ox,oy] of [[8,8],[b.w-8,8],[8,b.h-8],[b.w-8,b.h-8]]){
      ctx.beginPath();
      ctx.arc(x+ox,y+oy,2.4,0,Math.PI*2);
      ctx.fill();
    }
  }
  ctx.restore();
}

function jcDrawOpaqueDecor(){
  const type=jcCourseType();
  if(type==="cave"||type==="fortress")return;
  ctx.save();
  for(let i=0;i<18;i++){
    const wx=(i*577)%currentWorldWidth;
    const x=wx-cameraX;
    if(x<-100||x>WIDTH+100)continue;
    const y=735-(i%2)*4;

    ctx.fillStyle=i%3===0?"#2f8a43":"#3fa553";
    ctx.beginPath();
    ctx.arc(x-15,y,18,0,Math.PI*2);
    ctx.arc(x+5,y-8,22,0,Math.PI*2);
    ctx.arc(x+26,y,17,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#68c96d";
    ctx.beginPath();
    ctx.arc(x,y-12,10,0,Math.PI*2);
    ctx.fill();

    if(i%2===0){
      ctx.strokeStyle="#26733b";
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(x+10,y);
      ctx.lineTo(x+10,y-22);
      ctx.stroke();

      ctx.fillStyle=i%4===0?"#ffd15f":"#ff8db5";
      for(let a=0;a<5;a++){
        const ang=a*Math.PI*2/5;
        ctx.beginPath();
        ctx.arc(x+10+Math.cos(ang)*5,y-24+Math.sin(ang)*5,3.5,0,Math.PI*2);
        ctx.fill();
      }
      ctx.fillStyle="#fff1a0";
      ctx.beginPath();
      ctx.arc(x+10,y-24,2.5,0,Math.PI*2);
      ctx.fill();
    }
  }
  ctx.restore();
}

function jcDrawEnemyUpgrade(){

/* ==========================================================
   JUMPORIA WORLD-ANCHORED ULTRA DETAIL PASS
   All added foreground/terrain details are tied to world X
   so they scroll naturally with the camera.
========================================================== */

function juType(){
  return inSecret ? "cave" : courses[currentCourse].type;
}
function juHash(n){
  const x=Math.sin(n*127.1+311.7)*43758.5453;
  return x-Math.floor(x);
}
function juVisible(wx,pad=120){
  const sx=wx-cameraX;
  return sx>-pad&&sx<WIDTH+pad;
}

/* ----- terrain: world-anchored detail ----- */
function juTerrainDetail(){
  const type=juType();
  const outdoor=type!=="cave"&&type!=="fortress";
  ctx.save();

  for(let pi=0;pi<platforms.length;pi++){
    const p=platforms[pi];
    const sx=p.x-cameraX;
    if(sx>WIDTH+100||sx+p.w<-100)continue;

    // crisp top bevel
    ctx.fillStyle=type==="cave"?"#68d8e4":
                  type==="fortress"?"#8b5e70":
                  type==="sunset"?"#83c657":"#75c95b";
    ctx.fillRect(sx,p.y,p.w,9);

    ctx.fillStyle=type==="cave"?"#267c91":
                  type==="fortress"?"#513441":
                  outdoor?"#397b38":"#465a55";
    ctx.fillRect(sx,p.y+9,p.w,8);

    // world-anchored strata / stones
    const cell=42;
    let start=Math.floor(p.x/cell)*cell;
    for(let wx=start;wx<p.x+p.w;wx+=cell){
      const local=wx-p.x;
      if(local<4||local>p.w-10)continue;
      const seed=Math.floor(wx/cell)+pi*97;
      const r=juHash(seed);
      const y=p.y+27+(seed%3)*24;
      if(y>p.y+p.h-12)continue;
      const x=wx-cameraX;
      const w=18+Math.floor(r*18);
      const h=7+Math.floor(juHash(seed+5)*8);

      ctx.fillStyle=type==="cave"?(r>.5?"#315e70":"#244b5d"):
                    type==="fortress"?(r>.5?"#47313d":"#312630"):
                    (r>.5?"#725039":"#543b2d");
      ctx.beginPath();
      ctx.moveTo(x-w*.5,y);
      ctx.lineTo(x-w*.18,y-h);
      ctx.lineTo(x+w*.42,y-h*.55);
      ctx.lineTo(x+w*.5,y+h*.18);
      ctx.lineTo(x,y+h);
      ctx.closePath();
      ctx.fill();

      // small opaque highlight
      ctx.fillStyle=type==="cave"?"#5f98a5":
                    type==="fortress"?"#755262":"#987158";
      ctx.fillRect(x-w*.18,y-h+2,Math.max(3,w*.24),2);
    }

    if(outdoor){
      // grass clusters, anchored to world coordinates
      const grassStep=24;
      let gx0=Math.floor(p.x/grassStep)*grassStep;
      for(let wx=gx0;wx<p.x+p.w;wx+=grassStep){
        if(wx<p.x+5||wx>p.x+p.w-5)continue;
        const seed=Math.floor(wx/grassStep)+pi*31;
        const x=wx-cameraX;
        const h=6+Math.floor(juHash(seed)*8);
        ctx.strokeStyle=seed%2?"#b6eb78":"#8fd85f";
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(x,p.y+2);
        ctx.lineTo(x-4,p.y-h);
        ctx.moveTo(x+2,p.y+2);
        ctx.lineTo(x+6,p.y-h*.75);
        ctx.stroke();

        if(seed%7===0){
          ctx.fillStyle=seed%14===0?"#ffd75d":"#ff91ba";
          ctx.beginPath();ctx.arc(x+1,p.y-h-3,3.3,0,Math.PI*2);ctx.fill();
          ctx.fillStyle="#fff0a1";
          ctx.beginPath();ctx.arc(x+1,p.y-h-3,1.3,0,Math.PI*2);ctx.fill();
        }
      }
    } else if(type==="cave"){
      // tiny crystal seams
      for(let wx=Math.floor(p.x/90)*90;wx<p.x+p.w;wx+=90){
        if(wx<p.x+10||wx>p.x+p.w-10)continue;
        const x=wx-cameraX, y=p.y+24+(Math.floor(wx/90)%2)*20;
        ctx.fillStyle=(Math.floor(wx/90)%3===0)?"#80edf2":"#5bc1db";
        ctx.beginPath();
        ctx.moveTo(x,y-11);ctx.lineTo(x+6,y);ctx.lineTo(x,y+8);ctx.lineTo(x-5,y);ctx.closePath();ctx.fill();
      }
    }
  }
  ctx.restore();
}

/* ----- complex background layers ----- */
function juMountainLayer(speed,baseY,scale,front,type){
  ctx.save();
  const spacing=520*scale;
  const offset=(cameraX*speed)%spacing;
  const count=Math.ceil(WIDTH/spacing)+4;
  for(let i=-2;i<count;i++){
    const worldIndex=Math.floor(cameraX*speed/spacing)+i;
    const x=i*spacing-offset;
    const h=(150+juHash(worldIndex+17)*170)*scale;
    const w=(340+juHash(worldIndex+51)*170)*scale;

    let c1,c2,c3;
    if(type==="sunset"){
      c1=front?"#75606f":"#947489"; c2=front?"#554d61":"#786577"; c3="#c29a8f";
    }else if(type==="sky"){
      c1=front?"#5b8297":"#7ba0b2"; c2=front?"#46697d":"#64889b"; c3="#a9c8d5";
    }else{
      c1=front?"#56829a":"#81a8ba"; c2=front?"#41687e":"#63899b"; c3="#b6d3df";
    }

    ctx.fillStyle=c1;
    ctx.beginPath();
    ctx.moveTo(x-w*.52,baseY);
    ctx.lineTo(x-w*.2,baseY-h*.58);
    ctx.lineTo(x,baseY-h);
    ctx.lineTo(x+w*.17,baseY-h*.67);
    ctx.lineTo(x+w*.52,baseY);
    ctx.closePath();ctx.fill();

    // second face for richer mountain geometry
    ctx.fillStyle=c2;
    ctx.beginPath();
    ctx.moveTo(x,baseY-h);
    ctx.lineTo(x+w*.17,baseY-h*.67);
    ctx.lineTo(x+w*.52,baseY);
    ctx.lineTo(x+w*.08,baseY);
    ctx.closePath();ctx.fill();

    // snow/light edge
    if(!front){
      ctx.fillStyle=c3;
      ctx.beginPath();
      ctx.moveTo(x,baseY-h);
      ctx.lineTo(x-w*.09,baseY-h*.78);
      ctx.lineTo(x,baseY-h*.83);
      ctx.lineTo(x+w*.08,baseY-h*.72);
      ctx.lineTo(x+w*.17,baseY-h*.67);
      ctx.closePath();ctx.fill();
    }

    // vertical rock seams
    ctx.strokeStyle=front?"#35576a":"#64899c";
    ctx.lineWidth=2;
    for(let k=1;k<=3;k++){
      const rx=x-w*.32+k*w*.16;
      ctx.beginPath();
      ctx.moveTo(rx,baseY-15);
      ctx.lineTo(rx+(k%2?18:-14),baseY-h*.42);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function juCloudLayer(speed,yBase,scale,type){
  ctx.save();
  const spacing=430*scale;
  const offset=(cameraX*speed)%spacing;
  const count=Math.ceil(WIDTH/spacing)+5;
  for(let i=-2;i<count;i++){
    const idx=Math.floor(cameraX*speed/spacing)+i;
    const x=i*spacing-offset;
    const y=yBase+(idx%3)*38;
    const w=(110+juHash(idx+9)*85)*scale;
    const h=26*scale;

    ctx.fillStyle=type==="sunset"?"#f6d8c0":"#eefbff";
    ctx.beginPath();
    ctx.ellipse(x,y,w*.5,h,0,0,Math.PI*2);
    ctx.ellipse(x-w*.22,y-15*scale,w*.26,h*.9,0,0,Math.PI*2);
    ctx.ellipse(x+w*.18,y-10*scale,w*.3,h*.95,0,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle=type==="sunset"?"#e7bba8":"#cfe8f2";
    ctx.fillRect(x-w*.38,y+h*.38,w*.76,3*scale);
  }
  ctx.restore();
}

function juFloatingIslandLayer(speed,yBase,scale,type){
  ctx.save();
  const spacing=680*scale;
  const offset=(cameraX*speed)%spacing;
  const count=Math.ceil(WIDTH/spacing)+4;
  for(let i=-2;i<count;i++){
    const idx=Math.floor(cameraX*speed/spacing)+i;
    const x=i*spacing-offset;
    const y=yBase+(idx%3)*80;
    const w=(125+juHash(idx+70)*70)*scale;
    const h=(110+juHash(idx+91)*75)*scale;

    ctx.fillStyle=type==="sunset"?"#696378":"#4f778b";
    ctx.beginPath();
    ctx.moveTo(x-w,y);
    ctx.quadraticCurveTo(x,y-35*scale,x+w,y);
    ctx.lineTo(x+w*.38,y+h*.82);
    ctx.lineTo(x,y+h);
    ctx.lineTo(x-w*.4,y+h*.78);
    ctx.closePath();ctx.fill();

    ctx.fillStyle=type==="sunset"?"#79b35a":"#59b865";
    ctx.beginPath();ctx.ellipse(x,y-2,w,25*scale,0,0,Math.PI*2);ctx.fill();

    // tree clusters
    for(let q=-2;q<=2;q++){
      const tx=x+q*w*.26;
      const th=(24+juHash(idx*11+q+6)*22)*scale;
      ctx.fillStyle="#4b6548";ctx.fillRect(tx-2*scale,y-th,4*scale,th);
      ctx.fillStyle=q%2?"#3c884d":"#4a9a56";
      ctx.beginPath();ctx.arc(tx,y-th,11*scale,0,Math.PI*2);ctx.fill();
    }

    // waterfall with opaque multi-stripe texture
    if(idx%2===0){
      ctx.fillStyle="#b9eafb";ctx.fillRect(x-11*scale,y+8*scale,22*scale,h*.72);
      ctx.fillStyle="#e4f9ff";ctx.fillRect(x-3*scale,y+8*scale,6*scale,h*.72);
      ctx.fillStyle="#8fd8ef";ctx.fillRect(x+7*scale,y+8*scale,3*scale,h*.72);
    }

    // tiny tower on some islands
    if(idx%4===1){
      ctx.fillStyle=type==="sunset"?"#6c596d":"#55778a";
      ctx.fillRect(x-13*scale,y-63*scale,26*scale,58*scale);
      ctx.fillStyle="#f6d36d";ctx.fillRect(x-4*scale,y-48*scale,8*scale,12*scale);
      ctx.fillStyle=type==="sunset"?"#8a6575":"#688a9d";
      ctx.beginPath();ctx.moveTo(x-18*scale,y-63*scale);ctx.lineTo(x,y-88*scale);ctx.lineTo(x+18*scale,y-63*scale);ctx.closePath();ctx.fill();
    }
  }
  ctx.restore();
}

function juCaveBackground(){
  ctx.save();
  // Opaque layered rock silhouettes, parallaxed
  for(let layer=0;layer<3;layer++){
    const speed=.04+layer*.05;
    const spacing=360-layer*20;
    const offset=(cameraX*speed)%spacing;
    const yBase=160+layer*85;
    const color=layer===0?"#18253d":layer===1?"#20344f":"#29445a";
    for(let i=-2;i<Math.ceil(WIDTH/spacing)+4;i++){
      const idx=Math.floor(cameraX*speed/spacing)+i;
      const x=i*spacing-offset;
      const h=90+juHash(idx+layer*43)*140;
      ctx.fillStyle=color;
      ctx.beginPath();
      ctx.moveTo(x-120,yBase);
      ctx.lineTo(x-70,yBase-h*.55);
      ctx.lineTo(x,yBase-h);
      ctx.lineTo(x+85,yBase-h*.36);
      ctx.lineTo(x+150,yBase);
      ctx.closePath();ctx.fill();

      if((idx+layer)%3===0){
        ctx.fillStyle=layer===2?"#59c8e0":"#3e88a2";
        ctx.beginPath();
        ctx.moveTo(x,yBase-h+8);
        ctx.lineTo(x+12,yBase-h+28);
        ctx.lineTo(x+3,yBase-h+58);
        ctx.lineTo(x-11,yBase-h+30);
        ctx.closePath();ctx.fill();
      }
    }
  }
  ctx.restore();
}

function juFortressBackground(){
  ctx.save();
  const spacing=460;
  const offset=(cameraX*.10)%spacing;
  for(let i=-2;i<Math.ceil(WIDTH/spacing)+4;i++){
    const idx=Math.floor(cameraX*.10/spacing)+i;
    const x=i*spacing-offset;
    const h=170+(idx%3)*50;
    ctx.fillStyle="#30222e";
    ctx.fillRect(x-70,560-h,140,h);
    ctx.fillStyle="#422a35";
    for(let k=-2;k<=2;k++){
      ctx.fillRect(x+k*25-8,540-h,16,28);
    }
    ctx.fillStyle="#e1785b";
    for(let wy=600-h;wy<520;wy+=42){
      ctx.fillRect(x-35,wy,12,18);
      ctx.fillRect(x+22,wy+16,12,18);
    }
  }
  ctx.restore();
}

function juComplexBackground(){
  const type=juType();
  if(type==="cave"){juCaveBackground();return}
  if(type==="fortress"){juFortressBackground();return}

  // back-to-front parallax stack
  juMountainLayer(.018,600,.82,false,type);
  juCloudLayer(.028,150,.9,type);
  juMountainLayer(.045,665,1.05,false,type);
  juCloudLayer(.065,275,1.05,type);
  juFloatingIslandLayer(.10,300,.72,type);
  juMountainLayer(.085,735,1.10,true,type);
  juFloatingIslandLayer(.16,410,.92,type);
}

/* ----- world-coordinate small scenery tied to actual level ----- */
function juWorldDecor(){
  const type=juType();
  if(type==="cave"||type==="fortress")return;
  ctx.save();

  // Decorations use fixed WORLD x positions, not viewport positions.
  const step=430;
  const first=Math.max(0,Math.floor((cameraX-200)/step));
  const last=Math.min(Math.ceil(currentWorldWidth/step),Math.ceil((cameraX+WIDTH+200)/step));
  for(let i=first;i<=last;i++){
    const wx=i*step+80+juHash(i*13)*120;
    const x=wx-cameraX;
    const y=736;

    // layered shrub
    ctx.fillStyle=i%2?"#318d46":"#3aa04e";
    ctx.beginPath();
    ctx.arc(x-16,y,18,0,Math.PI*2);
    ctx.arc(x+3,y-10,23,0,Math.PI*2);
    ctx.arc(x+27,y,18,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#65c367";
    ctx.beginPath();ctx.arc(x+2,y-16,11,0,Math.PI*2);ctx.fill();

    // flower / stone variant
    if(i%3===0){
      ctx.strokeStyle="#2d743a";ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(x+15,y);ctx.lineTo(x+15,y-28);ctx.stroke();
      ctx.fillStyle=i%2?"#ffd361":"#ff92b7";
      for(let k=0;k<5;k++){
        const a=k*Math.PI*2/5;
        ctx.beginPath();ctx.arc(x+15+Math.cos(a)*5,y-30+Math.sin(a)*5,3.5,0,Math.PI*2);ctx.fill();
      }
      ctx.fillStyle="#fff2a8";ctx.beginPath();ctx.arc(x+15,y-30,2.2,0,Math.PI*2);ctx.fill();
    }else{
      ctx.fillStyle="#66736d";
      ctx.beginPath();ctx.ellipse(x+18,y+2,14,8,-.12,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#9aa7a0";
      ctx.fillRect(x+13,y-2,6,2);
    }
  }
  ctx.restore();
}

function jsWorldPatternX(wx, step){

}

/* Replace terrain detail with globally aligned world-coordinate patterning */
juTerrainDetail=function(){
  const type=juType();
  const outdoor=type!=="cave"&&type!=="fortress";
  ctx.save();

  const cellX=44;
  const rowH=28;

  for(let pi=0;pi<platforms.length;pi++){
    const p=platforms[pi];
    const sx=p.x-cameraX;
    if(sx>WIDTH+120||sx+p.w<-120)continue;

    // solid top cap
    ctx.fillStyle=type==="cave"?"#68d8e4":
                  type==="fortress"?"#8b5e70":
                  type==="sunset"?"#83c657":"#75c95b";
    ctx.fillRect(sx,p.y,p.w,9);

    ctx.fillStyle=type==="cave"?"#267c91":
                  type==="fortress"?"#513441":
                  outdoor?"#397b38":"#465a55";
    ctx.fillRect(sx,p.y+9,p.w,8);

    // IMPORTANT: global world-aligned rows/columns so adjacent platforms line up.
    const firstWX=Math.floor(p.x/cellX)*cellX;
    const firstWY=Math.floor((p.y+22)/rowH)*rowH;

    for(let wy=firstWY;wy<p.y+p.h-8;wy+=rowH){
      const row=Math.floor(wy/rowH);
      const offset=(row%2)*cellX*.5;
      let wx=Math.floor((p.x-offset)/cellX)*cellX+offset;

      for(;wx<p.x+p.w;wx+=cellX){
        if(wx<p.x+3||wx>p.x+p.w-3)continue;
        if(wy<p.y+21||wy>p.y+p.h-9)continue;

        const x=wx-cameraX;
        const seed=Math.floor(wx/cellX)*13+row*17;
        const r=juHash(seed);
        const w=24+Math.floor(r*13);
        const h=8+Math.floor(juHash(seed+31)*7);

        ctx.fillStyle=type==="cave"?(r>.5?"#315e70":"#244b5d"):
                      type==="fortress"?(r>.5?"#47313d":"#312630"):
                      (r>.5?"#725039":"#543b2d");
        ctx.beginPath();
        ctx.moveTo(x-w*.5,wy);
        ctx.lineTo(x-w*.16,wy-h);
        ctx.lineTo(x+w*.42,wy-h*.55);
        ctx.lineTo(x+w*.5,wy+h*.2);
        ctx.lineTo(x,wy+h);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle=type==="cave"?"#5f98a5":
                      type==="fortress"?"#755262":"#987158";
        ctx.fillRect(x-w*.15,wy-h+2,Math.max(3,w*.22),2);
      }
    }

    // globally aligned grass
    if(outdoor){
      const grassStep=22;
      let gx=Math.floor(p.x/grassStep)*grassStep;
      for(;gx<p.x+p.w;gx+=grassStep){
        if(gx<p.x+3||gx>p.x+p.w-3)continue;
        const seed=Math.floor(gx/grassStep);
        const x=gx-cameraX;
        const h=6+Math.floor(juHash(seed*7)*7);
        ctx.strokeStyle=seed%2?"#b6eb78":"#8fd85f";
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(x,p.y+2);
        ctx.lineTo(x-4,p.y-h);
        ctx.moveTo(x+2,p.y+2);
        ctx.lineTo(x+6,p.y-h*.78);
        ctx.stroke();

        if(seed%11===0){
          ctx.fillStyle=seed%22===0?"#ffd75d":"#ff91ba";
          ctx.beginPath();ctx.arc(x+1,p.y-h-3,3.1,0,Math.PI*2);ctx.fill();
          ctx.fillStyle="#fff0a1";
          ctx.beginPath();ctx.arc(x+1,p.y-h-3,1.2,0,Math.PI*2);ctx.fill();
        }
      }
    }
  }
  ctx.restore();
};

/* Grand original castle in the far background */
function jsGrandCastle(type){
  if(type==="cave")return;
  ctx.save();

  const par=.055;
  const castleWorldX=currentWorldWidth*.52;
  const x=castleWorldX-cameraX*par;
  const baseY=560;

  // scale by world type
  const s=type==="fortress"?1.18:1.0;

  // distant foundation / hill
  ctx.fillStyle=type==="sunset"?"#665a6c":type==="fortress"?"#251b25":"#4d7183";
  ctx.beginPath();
  ctx.ellipse(x,baseY+70,420*s,105*s,0,0,Math.PI*2);
  ctx.fill();

  // main keep
  ctx.fillStyle=type==="fortress"?"#3a2935":"#66879a";
  ctx.fillRect(x-135*s,baseY-210*s,270*s,220*s);

  // side wings
  ctx.fillStyle=type==="fortress"?"#33232f":"#5d7e91";
  ctx.fillRect(x-280*s,baseY-155*s,125*s,165*s);
  ctx.fillRect(x+155*s,baseY-155*s,125*s,165*s);

  // towers
  const towers=[
    {dx:-255,h:240,w:90},
    {dx:-105,h:310,w:95},
    {dx:105,h:310,w:95},
    {dx:255,h:240,w:90}
  ];
  for(const tw of towers){
    const tx=x+tw.dx*s;
    const ty=baseY-tw.h*s;
    ctx.fillStyle=type==="fortress"?"#422c38":"#6b8da0";
    ctx.fillRect(tx-tw.w*s/2,ty,tw.w*s,tw.h*s);

    // roof
    ctx.fillStyle=type==="sunset"?"#70536b":type==="fortress"?"#5b2e3d":"#4f6e87";
    ctx.beginPath();
    ctx.moveTo(tx-tw.w*.72*s,ty);
    ctx.lineTo(tx,ty-80*s);
    ctx.lineTo(tx+tw.w*.72*s,ty);
    ctx.closePath();
    ctx.fill();

    // flag
    ctx.strokeStyle=type==="fortress"?"#a65b64":"#d4e9f2";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(tx,ty-80*s);
    ctx.lineTo(tx,ty-125*s);
    ctx.stroke();

    ctx.fillStyle=type==="fortress"?"#c34f55":"#f3d46f";
    ctx.beginPath();
    ctx.moveTo(tx,ty-124*s);
    ctx.lineTo(tx+36*s,ty-112*s);
    ctx.lineTo(tx,ty-100*s);
    ctx.closePath();
    ctx.fill();

    // windows
    ctx.fillStyle=type==="fortress"?"#e1785b":"#f9dc77";
    for(let wy=ty+42*s;wy<baseY-30*s;wy+=52*s){
      ctx.fillRect(tx-8*s,wy,16*s,23*s);
    }
  }

  // central roof
  ctx.fillStyle=type==="sunset"?"#79576f":type==="fortress"?"#623444":"#55748c";
  ctx.beginPath();
  ctx.moveTo(x-165*s,baseY-210*s);
  ctx.lineTo(x,baseY-360*s);
  ctx.lineTo(x+165*s,baseY-210*s);
  ctx.closePath();
  ctx.fill();

  // central emblem
  ctx.fillStyle=type==="fortress"?"#d56762":"#f1cf63";
  ctx.beginPath();
  ctx.arc(x,baseY-160*s,24*s,0,Math.PI*2);
  ctx.fill();

  // arched gate
  ctx.fillStyle=type==="fortress"?"#201820":"#344f61";
  ctx.beginPath();
  ctx.moveTo(x-38*s,baseY+10*s);
  ctx.lineTo(x-38*s,baseY-65*s);
  ctx.arc(x,baseY-65*s,38*s,Math.PI,0);
  ctx.lineTo(x+38*s,baseY+10*s);
  ctx.closePath();
  ctx.fill();

  // bridge leading toward castle
  ctx.fillStyle=type==="fortress"?"#4a3339":"#778d91";
  ctx.beginPath();
  ctx.moveTo(x-380*s,baseY+55*s);
  ctx.lineTo(x-120*s,baseY+15*s);
  ctx.lineTo(x+120*s,baseY+15*s);
  ctx.lineTo(x+380*s,baseY+55*s);
  ctx.lineTo(x+380*s,baseY+80*s);
  ctx.lineTo(x-380*s,baseY+80*s);
  ctx.closePath();
  ctx.fill();

  // bridge arches
  ctx.fillStyle=type==="fortress"?"#2a1e26":"#526d7b";
  for(let ax=-260;ax<=260;ax+=130){
    ctx.beginPath();
    ctx.arc(x+ax*s,baseY+80*s,34*s,Math.PI,0);
    ctx.lineTo(x+(ax+34)*s,baseY+80*s);
    ctx.closePath();
    ctx.fill();
  }

  ctx.restore();
}

/* Single authoritative terrain-detail renderer */
function jtDrawLockedTerrain(){
  const type=inSecret ? "cave" : courses[currentCourse].type;
  const outdoor=type!=="cave"&&type!=="fortress";

  ctx.save();

  for(let pi=0;pi<platforms.length;pi++){
    const p=platforms[pi];
    const sx=Math.round(p.x-cameraX);
    const sy=Math.round(p.y);
    const sw=Math.round(p.w);
    const sh=Math.round(p.h);

    if(sx>WIDTH+80||sx+sw<-80||sw<=0||sh<=0)continue;

    /* HARD CLIP:
       every pattern is restricted to the exact platform rectangle */
    ctx.save();
    ctx.beginPath();
    ctx.rect(sx,sy,sw,sh);
    ctx.clip();

    /* top surface: exact same coordinates as platform */
    ctx.fillStyle=
      type==="cave"?"#63d2df":
      type==="fortress"?"#855a6b":
      type==="sunset"?"#7fc553":
      "#73c857";
    ctx.fillRect(sx,sy,sw,10);

    ctx.fillStyle=
      type==="cave"?"#287b90":
      type==="fortress"?"#50323f":
      outdoor?"#3b7e38":"#465b55";
    ctx.fillRect(sx,sy+10,sw,8);

    /* body pattern uses GLOBAL world coordinates,
       but is clipped to THIS platform body */
    const tileW=46;
    const tileH=30;

    const worldLeft=p.x;
    const worldRight=p.x+p.w;
    const bodyTop=p.y+20;
    const bodyBottom=p.y+p.h;

    const firstRow=Math.floor(bodyTop/tileH);
    const lastRow=Math.ceil(bodyBottom/tileH);

    for(let row=firstRow;row<=lastRow;row++){
      const wy=row*tileH;
      if(wy<bodyTop||wy>bodyBottom)continue;

      const rowOffset=(row&1)?tileW/2:0;
      let col=Math.floor((worldLeft-rowOffset)/tileW)-1;
      const maxCol=Math.ceil((worldRight-rowOffset)/tileW)+1;

      for(;col<=maxCol;col++){
        const wx=col*tileW+rowOffset;
        if(wx<worldLeft-30||wx>worldRight+30)continue;

        const x=Math.round(wx-cameraX);
        const seed=col*37+row*101;
        const r=juHash(seed);
        const w=24+Math.floor(r*12);
        const h=8+Math.floor(juHash(seed+23)*7);

        ctx.fillStyle=
          type==="cave"?(r>.5?"#315f70":"#244b5c"):
          type==="fortress"?(r>.5?"#47303b":"#30252e"):
          (r>.5?"#765139":"#563b2c");

        ctx.beginPath();
        ctx.moveTo(x-w*.50,wy);
        ctx.lineTo(x-w*.17,wy-h);
        ctx.lineTo(x+w*.40,wy-h*.55);
        ctx.lineTo(x+w*.50,wy+h*.20);
        ctx.lineTo(x,wy+h);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle=
          type==="cave"?"#6099a6":
          type==="fortress"?"#765362":
          "#9c7457";
        ctx.fillRect(Math.round(x-w*.16),Math.round(wy-h+2),Math.max(3,Math.round(w*.23)),2);
      }
    }

    /* grass uses world X but platform Y, and is clipped to top */
    if(outdoor){
      const grassStep=20;
      let gcol=Math.floor(p.x/grassStep)-1;
      const gmax=Math.ceil((p.x+p.w)/grassStep)+1;

      for(;gcol<=gmax;gcol++){
        const wx=gcol*grassStep;
        if(wx<p.x||wx>p.x+p.w)continue;

        const x=Math.round(wx-cameraX);
        const seed=gcol*13;
        const gh=6+Math.floor(juHash(seed)*7);

        ctx.strokeStyle=(gcol&1)?"#b8ea7a":"#90d85f";
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(x,sy+3);
        ctx.lineTo(x-4,sy-gh);
        ctx.moveTo(x+2,sy+3);
        ctx.lineTo(x+6,sy-gh*.75);
        ctx.stroke();
      }
    }

    ctx.restore();

    /* crisp border OUTSIDE clip, exact platform coordinates */
    ctx.strokeStyle=
      type==="cave"?"#1f6475":
      type==="fortress"?"#3a2731":
      "#315f2f";
    ctx.lineWidth=2;
    ctx.strokeRect(sx+.5,sy+.5,Math.max(0,sw-1),Math.max(0,sh-1));
  }

  ctx.restore();
}

/* ==========================================================
   JUMPORIA CAMERA-SYNC TERRAIN FIX
   IMPORTANT:
   drawPlatforms() is already rendered inside:
     ctx.translate(-cameraX, ...)
   Therefore terrain details MUST use raw world coordinates.
========================================================== */

function jcsDrawTerrain(){
  const type=inSecret ? "cave" : courses[currentCourse].type;
  const outdoor=type!=="cave"&&type!=="fortress";

  ctx.save();

  for(let pi=0;pi<platforms.length;pi++){
    const p=platforms[pi];

    // Since the canvas is ALREADY translated by -cameraX,
    // use raw world coordinates here.
    const x=p.x;
    const y=p.y;
    const w=p.w;
    const h=p.h;

    if(p.x-cameraX>WIDTH+100 || p.x+p.w-cameraX<-100)continue;

    ctx.save();
    ctx.beginPath();
    ctx.rect(x,y,w,h);
    ctx.clip();

    /* exact platform top */
    ctx.fillStyle=
      type==="cave"?"#63d2df":
      type==="fortress"?"#855a6b":
      type==="sunset"?"#7fc553":
      "#73c857";
    ctx.fillRect(x,y,w,10);

    ctx.fillStyle=
      type==="cave"?"#287b90":
      type==="fortress"?"#50323f":
      outdoor?"#3b7e38":
      "#465b55";
    ctx.fillRect(x,y+10,w,8);

    /* world-global pattern with ZERO extra camera subtraction */
    const tileW=46;
    const tileH=30;
    const bodyTop=y+22;
    const bodyBottom=y+h;

    const firstRow=Math.floor(bodyTop/tileH);
    const lastRow=Math.ceil(bodyBottom/tileH);

    for(let row=firstRow;row<=lastRow;row++){
      const wy=row*tileH;
      if(wy<bodyTop||wy>bodyBottom)continue;

      const rowOffset=(row&1)?tileW/2:0;
      let col=Math.floor((x-rowOffset)/tileW)-1;
      const maxCol=Math.ceil((x+w-rowOffset)/tileW)+1;

      for(;col<=maxCol;col++){
        const wx=col*tileW+rowOffset;
        if(wx<x-30||wx>x+w+30)continue;

        const seed=col*37+row*101;
        const r=juHash(seed);
        const pw=24+Math.floor(r*12);
        const ph=8+Math.floor(juHash(seed+23)*7);

        ctx.fillStyle=
          type==="cave"?(r>.5?"#315f70":"#244b5c"):
          type==="fortress"?(r>.5?"#47303b":"#30252e"):
          (r>.5?"#765139":"#563b2c");

        ctx.beginPath();
        ctx.moveTo(wx-pw*.50,wy);
        ctx.lineTo(wx-pw*.17,wy-ph);
        ctx.lineTo(wx+pw*.40,wy-ph*.55);
        ctx.lineTo(wx+pw*.50,wy+ph*.20);
        ctx.lineTo(wx,wy+ph);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle=
          type==="cave"?"#6099a6":
          type==="fortress"?"#765362":
          "#9c7457";
        ctx.fillRect(wx-pw*.16,wy-ph+2,Math.max(3,pw*.23),2);
      }
    }

    /* grass also raw world coordinates */
    if(outdoor){
      const grassStep=20;
      let col=Math.floor(x/grassStep)-1;
      const maxCol=Math.ceil((x+w)/grassStep)+1;

      for(;col<=maxCol;col++){
        const wx=col*grassStep;
        if(wx<x||wx>x+w)continue;

        const seed=col*13;
        const gh=6+Math.floor(juHash(seed)*7);

        ctx.strokeStyle=(col&1)?"#b8ea7a":"#90d85f";
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(wx,y+3);
        ctx.lineTo(wx-4,y-gh);
        ctx.moveTo(wx+2,y+3);
        ctx.lineTo(wx+6,y-gh*.75);
        ctx.stroke();
      }
    }

    ctx.restore();

    ctx.strokeStyle=
      type==="cave"?"#1f6475":
      type==="fortress"?"#3a2731":
      "#315f2f";
    ctx.lineWidth=2;
    ctx.strokeRect(x+.5,y+.5,Math.max(0,w-1),Math.max(0,h-1));
  }

  ctx.restore();
}

  if(st!==5){
    const ps=platforms.filter(p=>p.w>=120&&p.x>currentWorldWidth*.62);
    const p=ps.length?ps[Math.max(0,ps.length-2)]:platforms[platforms.length-1];
    if(p)jgaSecret={x:p.x+p.w*.55,y:p.y-70,w:46,h:70,used:false};
  }
}

function jgaUpdate(){
  const w=jgaWorld(),st=jgaStage(),tm=performance.now()/1000;

  /* world wind */
  if(!player.grounded){
    if(w===2&&(st===1||st===4))player.vx+=0.06;
    if(w===3)player.vx+=(st===2?-0.09:0.09);
    if(w===4)player.vx+=0.12;
  }

  for(const g of jgaMoving){
    if(g.kind==="move"){
      g.p.x=g.bx+Math.sin(tm*(w===4?2.1:1.25)+g.phase)*(w===4?85:58);
    }else if(g.kind==="fall"){
      const on=player.x+player.w>g.p.x&&player.x<g.p.x+g.p.w&&Math.abs(player.y+player.h-g.p.y)<18;
      if(on)g.f=(g.f||0)+1;
      if((g.f||0)>20)g.p.y=Math.min(g.by+190,g.p.y+3.8);
    }else if(g.kind==="blink"){
      g.p._jgaVisible=Math.sin(tm*1.7+g.phase)>-.45;
    }
  }

  /* stage-specific enemy moves */
  enemies.forEach(e=>{
    if(!e.alive)return;
    const m=jgaEnemyMeta.get(e); if(!m)return;
    if(m.st===1&&m.w>=2&&Math.sin(tm*2.4+m.phase)>.992)e.vy=-7.5;
    if(m.st===2&&m.w>=2)e.y+=Math.sin(tm*3+m.phase)*.22;

    if(m.st===4&&m.w>=2)e.y+=Math.sin(tm*4+m.phase)*.35;
  });

  /* hazards */
  for(const h of jgaHazards){
    if(player.x+player.w>h.x&&player.x<h.x+h.w&&player.y+player.h>h.y&&player.y<h.y+h.h){
      jgaHit=true;
      if(typeof hurtPlayer==="function")hurtPlayer();
    }
  }

  /* secret exit */
  if(jgaSecret&&!jgaSecret.used){
    const q=jgaSecret;
    if(player.x+player.w>q.x&&player.x<q.x+q.w&&player.y+player.h>q.y&&player.y<q.y+q.h){
      q.used=true;jga.secrets[jgaKey()]=true;jgaUnlockCheck();
      addScore(2500);message.textContent="✨ SECRET EXIT!";
      if(typeof showGoalOverlay==="function")showGoalOverlay();
    }
  }

  /* approximate collectible progress from score deltas without touching core coin logic */
  if(score>jgaPrevScore&&score-jgaPrevScore<=250)jgaCoins++;
  if(lives<jgaPrevLives)jgaHit=true;
  jgaPrevScore=score;jgaPrevLives=lives;

  /* boss personalities */
  if(typeof boss!=="undefined"&&boss&&boss.active){
    if(w===2&&Math.sin(tm*1.9)>.994)boss.vy=-10;
    if(w===3)boss.y+=Math.sin(tm*3.2)*.45;
    if(w===4){boss.y+=Math.sin(tm*4.0)*.7;}
  }
}

function jgaDraw(){
  const w=jgaWorld(),st=jgaStage();

  /* hazards */
  ctx.save();
  for(const h of jgaHazards){
    const x=h.x-cameraX;

    ctx.fillStyle="#ffd45c";

  }

  /* secret gate */
  if(jgaSecret&&!jgaSecret.used){
    const q=jgaSecret,x=q.x-cameraX,y=q.y;
    ctx.fillStyle="#27365f";ctx.fillRect(x,y+18,q.w,q.h-18);
    ctx.fillStyle="#8cecff";ctx.fillRect(x+7,y+25,q.w-14,q.h-25);
    ctx.fillStyle="#ffe46c";ctx.beginPath();ctx.arc(x+q.w/2,y+39,7,0,Math.PI*2);ctx.fill();
    ctx.font="bold 15px sans-serif";ctx.textAlign="center";ctx.fillStyle="#fff";ctx.fillText("S",x+q.w/2,y+62);
  }

  /* enemy stage-color mark */
  enemies.forEach(e=>{
    if(!e.alive)return; const m=jgaEnemyMeta.get(e);if(!m)return;
    const x=e.x-cameraX+e.w/2;if(x<-80||x>WIDTH+80)return;

  const s=jga.stars[jgaKey()]||0;

  ctx.strokeStyle="#24334b";ctx.lineWidth=4;ctx.fillStyle="#ffe875";

  ctx.restore();
}

function jmxType(){return inSecret?"cave":courses[currentCourse].type}

function jmxStar(x,y,r){
  ctx.beginPath();
  ctx.moveTo(x,y-r*2);ctx.lineTo(x+r*.55,y-r*.5);
  ctx.lineTo(x+r*2,y);ctx.lineTo(x+r*.55,y+r*.5);
  ctx.lineTo(x,y+r*2);ctx.lineTo(x-r*.55,y+r*.5);
  ctx.lineTo(x-r*2,y);ctx.lineTo(x-r*.55,y-r*.5);
  ctx.closePath();ctx.fill();
}

function jmxBackgroundDetail(){
  if(inSecret)return;
  const type=jmxType();
  ctx.save();

  /* high sky glints, world anchored with gentle parallax */
  if(type!=="cave"&&type!=="fortress"){
    ctx.fillStyle=type==="sunset"?"#ffe8a3":"#f7fdff";
    for(let i=0;i<16;i++){
      const x=((i*337-cameraX*.045)%2400+2400)%2400-150;
      const y=62+(i*91)%260;
      jmxStar(x,y,1.4+(i%3)*.6);
    }

    /* distant layered ridges */
    const base=510;
    for(let layer=0;layer<3;layer++){
      const par=.035+layer*.035;
      const step=360-layer*30;
      const height=90-layer*16;
      ctx.fillStyle=
        type==="sunset"
          ?["#8d6c83","#77657b","#66596f"][layer]
          :["#7fa3b2","#668da0","#56798d"][layer];
      ctx.beginPath();
      ctx.moveTo(0,HEIGHT);
      for(let i=-2;i<8;i++){
        const wx=i*step-cameraX*par;
        const x=((wx%(step*7))+(step*7))%(step*7)-step;
        ctx.lineTo(x,base+layer*42);
        ctx.lineTo(x+step*.5,base-height);
        ctx.lineTo(x+step,base+layer*42);
      }
      ctx.lineTo(WIDTH,HEIGHT);ctx.closePath();ctx.fill();
    }

    /* large distant clouds, only a few for performance */
    for(let i=0;i<6;i++){
      const x=((190+i*520-cameraX*(.07+i*.006))%3600+3600)%3600-220;
      const y=120+(i%3)*92;
      const s=1+(i%2)*.28;
      ctx.fillStyle=type==="sunset"?"#ffd2b0":"#eaf8ff";
      ctx.beginPath();
      ctx.ellipse(x,y,58*s,19*s,0,0,Math.PI*2);
      ctx.ellipse(x+45*s,y-11*s,39*s,25*s,0,0,Math.PI*2);
      ctx.ellipse(x+86*s,y,54*s,18*s,0,0,Math.PI*2);
      ctx.fill();
    }
  }

  if(type==="cave"){
    /* distant crystal silhouettes */
    for(let i=0;i<13;i++){
      const x=((i*265-cameraX*.045)%2600+2600)%2600-120;
      const h=75+(i%5)*24;
      ctx.fillStyle=i%2?"#21395d":"#2b4569";
      ctx.beginPath();
      ctx.moveTo(x,620);ctx.lineTo(x+22,620-h);
      ctx.lineTo(x+42,620);ctx.closePath();ctx.fill();
    }
  }

  if(type==="fortress"){
    /* distant fortress skyline */
    ctx.fillStyle="#261925";
    for(let i=0;i<9;i++){
      const x=((i*290-cameraX*.06)%2900+2900)%2900-160;
      const h=120+(i%4)*38;
      ctx.fillRect(x,520-h,92,h);
      ctx.beginPath();
      ctx.moveTo(x-12,520-h);ctx.lineTo(x+46,470-h);
      ctx.lineTo(x+104,520-h);ctx.closePath();ctx.fill();
      ctx.fillStyle="#e77759";
      ctx.fillRect(x+38,520-h+38,12,22);
      ctx.fillStyle="#261925";
    }
  }

  ctx.restore();
}

/* World-detail pass runs inside the already translated world context.
   Use RAW world coordinates here: no extra camera subtraction. */
function jmxWorldDetail(){
  const type=jmxType();
  ctx.save();

  for(const p of platforms){
    if(p.x-cameraX>WIDTH+100||p.x+p.w-cameraX<-100)continue;

    if(type==="cave"){
      for(let x=p.x+28;x<p.x+p.w-18;x+=92){
        const seed=Math.floor(x/17+p.y/13);
        const h=9+(seed%4)*3;
        ctx.fillStyle=seed%2?"#6ce1e6":"#49a9c6";
        ctx.beginPath();
        ctx.moveTo(x,p.y+2);ctx.lineTo(x+6,p.y-h);
        ctx.lineTo(x+12,p.y+2);ctx.closePath();ctx.fill();
      }
    }else if(type==="fortress"){
      for(let x=p.x+34;x<p.x+p.w-20;x+=110){
        ctx.fillStyle="#a26a62";
        ctx.fillRect(x,p.y+4,4,8);
        ctx.fillStyle="#55343f";
        ctx.fillRect(x+4,p.y+6,18,3);
      }
    }else{
      /* grass tufts + flowers, anchored to terrain */
      for(let x=p.x+20;x<p.x+p.w-16;x+=68){
        const k=Math.floor(x/17+p.y/11);
        const gh=7+(k%4)*2;
        ctx.strokeStyle=k%2?"#b7ec79":"#8fd45d";
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(x,p.y+2);ctx.lineTo(x-4,p.y-gh);
        ctx.moveTo(x+2,p.y+2);ctx.lineTo(x+6,p.y-gh+2);
        ctx.stroke();

        if(k%3===0){
          ctx.fillStyle=type==="sunset"?"#ffd45a":"#fff3a8";
          ctx.beginPath();ctx.arc(x+10,p.y-6,3,0,Math.PI*2);ctx.fill();
          ctx.fillStyle="#ffffff";
          ctx.beginPath();ctx.arc(x+7,p.y-8,2,0,Math.PI*2);ctx.fill();
          ctx.beginPath();ctx.arc(x+13,p.y-8,2,0,Math.PI*2);ctx.fill();
        }
      }
    }

    /* integrated edge stones / seams */
    for(let x=p.x+38;x<p.x+p.w-24;x+=86){
      ctx.fillStyle=
        type==="cave"?"#315f70":
        type==="fortress"?"#49313b":
        "#6d4a35";
      ctx.beginPath();
      ctx.ellipse(x,p.y+30,8,4,.12,0,Math.PI*2);
      ctx.fill();
    }
  }

  ctx.restore();
}

function jHQBackgroundPolish(){

  skyGlow.addColorStop(0,"rgba(255,255,255,.045)");

    ctx.fillStyle=type==="sunset"?"#9a7c78":"#6f9daf";
    ctx.beginPath();
    ctx.moveTo(x-55*s,y);
    ctx.quadraticCurveTo(x,y+120*s,x+55*s,y);
    ctx.closePath();ctx.fill();

    const grass=ctx.createLinearGradient(0,y-16*s,0,y+8*s);
    grass.addColorStop(0,type==="sunset"?"#d8d468":"#9fe36e");
    grass.addColorStop(1,type==="sunset"?"#778c50":"#4d9f58");
    ctx.fillStyle=grass;
    ctx.beginPath();ctx.ellipse(x,y-5*s,60*s,16*s,0,0,Math.PI*2);ctx.fill();

    ctx.fillStyle=type==="sunset"?"#eee0a1":"#e6f5c0";
    ctx.beginPath();ctx.ellipse(x-14*s,y-9*s,19*s,5*s,0,0,Math.PI*2);ctx.fill();

    // tiny tree silhouette
    ctx.fillStyle="#4d6c4a";ctx.fillRect(x-3*s,y-35*s,6*s,27*s);
    ctx.fillStyle=type==="sunset"?"#718c58":"#4fa566";
    ctx.beginPath();ctx.arc(x,y-38*s,15*s,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x-10*s,y-31*s,11*s,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x+10*s,y-31*s,11*s,0,Math.PI*2);ctx.fill();
  }

}

function jrRand(seed){
  let x=Math.sin(seed*12.9898+78.233)*43758.5453;
  return x-Math.floor(x);
}

function jrCreateNoiseTexture(w,h,mode){
  const c=document.createElement("canvas");
  c.width=w;c.height=h;
  const g=c.getContext("2d");

  if(mode==="grass"){
    const grd=g.createLinearGradient(0,0,0,h);
    grd.addColorStop(0,"#84d74d");
    grd.addColorStop(.15,"#58b944");
    grd.addColorStop(.42,"#6c5738");
    grd.addColorStop(1,"#3c2d24");
    g.fillStyle=grd;g.fillRect(0,0,w,h);

    // soil stones
    for(let i=0;i<220;i++){
      const x=jrRand(i*3+1)*w, y=35+jrRand(i*7+2)*(h-35);
      const rw=3+jrRand(i*11+3)*12, rh=2+jrRand(i*13+4)*7;
      g.fillStyle=i%3===0?"#9d724e":i%3===1?"#70513b":"#523b2d";
      g.beginPath();g.ellipse(x,y,rw,rh,jrRand(i*17)*1.2,0,Math.PI*2);g.fill();

        g.fillStyle="rgba(244,199,133,.28)";
        g.beginPath();g.ellipse(x-rw*.25,y-rh*.25,rw*.35,rh*.3,0,0,Math.PI*2);g.fill();
      }

    // fine grass blades
    for(let i=0;i<190;i++){
      const x=jrRand(i*19+4)*w;
      const y=6+jrRand(i*23+2)*24;
      const hh=5+jrRand(i*29)*11;
      g.strokeStyle=i%3===0?"#c2f175":i%3===1?"#7ed456":"#49a83d";
      g.lineWidth=1.4;
      g.beginPath();g.moveTo(x,y+hh);g.lineTo(x-2+jrRand(i)*4,y);g.stroke();
    }
  }else if(mode==="cave"){
    const grd=g.createLinearGradient(0,0,0,h);
    grd.addColorStop(0,"#71677f");grd.addColorStop(.35,"#4d475e");grd.addColorStop(1,"#262533");
    g.fillStyle=grd;g.fillRect(0,0,w,h);
    for(let i=0;i<170;i++){
      const x=jrRand(i*5)*w,y=jrRand(i*9)*h;
      const r=2+jrRand(i*15)*10;
      g.fillStyle=i%4===0?"#776f8b":i%4===1?"#5e586e":"#3a3748";
      g.beginPath();g.ellipse(x,y,r*1.5,r,.4,0,Math.PI*2);g.fill();
    }
    for(let i=0;i<24;i++){
      const x=jrRand(i*31)*w,y=jrRand(i*37)*h;
      g.fillStyle=i%2?"#67d4dc":"#557ec6";
      g.beginPath();g.moveTo(x,y+10);g.lineTo(x+5,y-14);g.lineTo(x+11,y+10);g.closePath();g.fill();
    }
  }else{
    const grd=g.createLinearGradient(0,0,0,h);
    grd.addColorStop(0,"#62505a");grd.addColorStop(.35,"#493740");grd.addColorStop(1,"#241b23");
    g.fillStyle=grd;g.fillRect(0,0,w,h);
    for(let y=0;y<h;y+=32){
      for(let x=((y/32)%2)*28;x<w;x+=56){
        g.fillStyle=((x+y)/8)%2?"#60444d":"#4d3740";

        g.beginPath();g.moveTo(x+6,y+6);g.lineTo(x+47,y+6);g.stroke();
      }
    }
  }
  return c;
}

function jrBackgroundDepth(){
  if(inSecret)return;
  const type=courses[currentCourse].type;
  if(type==="cave"||type==="fortress")return;

  ctx.save();

  // Atmospheric horizon haze
  const haze=ctx.createLinearGradient(0,HEIGHT*.28,0,HEIGHT*.82);
  haze.addColorStop(0,"rgba(255,255,255,.04)");
  haze.addColorStop(.55,"rgba(227,248,255,.13)");
  haze.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=haze;ctx.fillRect(0,HEIGHT*.2,WIDTH,HEIGHT*.7);

  // Distant mountain ranges with multiple ridges
  for(let layer=0;layer<4;layer++){
    const base=545+layer*40;
    const amp=95-layer*13;
    const par=.018+layer*.022;
    const step=270+layer*26;

    ctx.fillStyle=
      type==="sunset"
        ?["#a0818b","#8d7981","#736c74","#626568"][layer]
        :["#83a8b6","#7397a7","#648595","#587686"][layer];

    ctx.beginPath();ctx.moveTo(-100,HEIGHT);
    for(let i=-2;i<11;i++){
      const wx=i*step-cameraX*par;
      const peak=base-amp-(i%3)*24;
      ctx.lineTo(wx,base);
      ctx.quadraticCurveTo(wx+step*.25,peak+25,wx+step*.5,peak);
      ctx.quadraticCurveTo(wx+step*.78,peak+30,wx+step,base);
    }
    ctx.lineTo(WIDTH+200,HEIGHT);ctx.closePath();ctx.fill();

    // light ridge cap
    ctx.strokeStyle=type==="sunset"?"rgba(255,220,190,.20)":"rgba(240,252,255,.25)";
    ctx.lineWidth=2;
    ctx.beginPath();
    for(let i=-2;i<11;i++){
      const wx=i*step-cameraX*par;
      const peak=base-amp-(i%3)*24;
      if(i===-2)ctx.moveTo(wx,base);
      ctx.quadraticCurveTo(wx+step*.25,peak+25,wx+step*.5,peak);
      ctx.quadraticCurveTo(wx+step*.78,peak+30,wx+step,base);
    }
    ctx.stroke();
  }

  // Realistic cloud masses, few draw groups for performance
  for(let i=0;i<7;i++){
    const loop=3400;
    const x=((170+i*505-cameraX*(.025+i*.004))%loop+loop)%loop-280;
    const y=95+(i%4)*92;
    const s=.82+(i%3)*.13;

    const cg=ctx.createRadialGradient(x,y-5,8,x,y,95*s);
    cg.addColorStop(0,type==="sunset"?"#fff5e7":"#ffffff");
    cg.addColorStop(.55,type==="sunset"?"#f6d9c6":"#e8f6ff");
    cg.addColorStop(1,type==="sunset"?"#d9a9a2":"#bbdce9");
    ctx.fillStyle=cg;

    ctx.beginPath();
    ctx.ellipse(x-60*s,y+8*s,62*s,28*s,0,0,Math.PI*2);
    ctx.ellipse(x-8*s,y-20*s,68*s,46*s,0,0,Math.PI*2);
    ctx.ellipse(x+58*s,y+4*s,70*s,31*s,0,0,Math.PI*2);
    ctx.ellipse(x+12*s,y+20*s,90*s,24*s,0,0,Math.PI*2);
    ctx.fill();
  }

  ctx.restore();
}

function jrTerrainMaterial(){
  const type=inSecret?"cave":courses[currentCourse].type;

  ctx.save();

    ctx.fillStyle=jrGetPattern(key);

        ctx.fillStyle="#a59b84";
        ctx.beginPath();ctx.ellipse(x-3,p.y+60,4,2,0,0,Math.PI*2);ctx.fill();

        if(k%3===0){
          ctx.strokeStyle="#427d37";ctx.lineWidth=2;
          ctx.beginPath();ctx.moveTo(x+20,p.y+13);ctx.lineTo(x+20,p.y-2);ctx.stroke();

          ctx.fillStyle="#ffd249";ctx.beginPath();ctx.arc(x+20,p.y-6,2.2,0,Math.PI*2);ctx.fill();

      const cap=ctx.createLinearGradient(0,p.y,0,p.y+27);
      cap.addColorStop(0,"#ba7367");cap.addColorStop(.33,"#80505a");cap.addColorStop(1,"#503640");
      ctx.fillStyle=cap;ctx.fillRect(p.x,p.y,p.w,25);
      ctx.fillStyle="#d4917d";ctx.fillRect(p.x,p.y+2,p.w,3);
    }
  }
  ctx.restore();
}

/* ---------- PAINTERLY BACKGROUND PLATE ---------- */
function jiBackgroundPlate(type){
  const c=jiCanvas(1920,1080),g=jiCtx(c);
  let sky=g.createLinearGradient(0,0,0,1080);
  if(type==="sunset"){
    sky.addColorStop(0,"#385b94");sky.addColorStop(.34,"#e18686");sky.addColorStop(.66,"#f2b167");sky.addColorStop(1,"#6a7583");
  }else if(type==="cave"){
    sky.addColorStop(0,"#17162a");sky.addColorStop(.5,"#312b4a");sky.addColorStop(1,"#14131f");
  }else if(type==="fortress"){
    sky.addColorStop(0,"#251525");sky.addColorStop(.48,"#472736");sky.addColorStop(1,"#140f18");
  }else{
    sky.addColorStop(0,"#228fe3");sky.addColorStop(.48,"#76c8ef");sky.addColorStop(1,"#dff5f3");
  }
  g.fillStyle=sky;g.fillRect(0,0,1920,1080);

  if(type!=="cave"&&type!=="fortress"){
    // painted cloud masses
    for(let i=0;i<34;i++){
      const x=jiSeed(i*13)*1920,y=60+jiSeed(i*17)*390;
      const s=.6+jiSeed(i*19)*1.3;
      g.globalAlpha=.22+.2*jiSeed(i*23);
      g.fillStyle="#ffffff";
      g.beginPath();g.ellipse(x,y,90*s,34*s,0,0,Math.PI*2);
      g.ellipse(x+65*s,y-18*s,75*s,48*s,0,0,Math.PI*2);
      g.ellipse(x+135*s,y,95*s,36*s,0,0,Math.PI*2);g.fill();
    }
    g.globalAlpha=1;

    // distant ridges, painterly rather than geometric.
    for(let layer=0;layer<4;layer++){
      const base=590+layer*75,amp=190-layer*28;
      g.fillStyle=["#7097a6","#608898","#537887","#476878"][layer];
      g.beginPath();g.moveTo(0,1080);
      for(let x=-100;x<=2020;x+=100){
        const n=Math.sin(x*.006+layer*1.7)*.55+Math.sin(x*.013+layer)*.25;
        g.lineTo(x,base-amp*(.48+.4*n));
      }
      g.lineTo(1920,1080);g.closePath();g.fill();
      jiBrushNoise(g,0,base-amp,1920,amp+160,80,"#91b2bb","#3f6471",.08);
    }

    // painterly tree masses
    for(let i=0;i<22;i++){
      const x=jiSeed(i*31)*1920,y=580+jiSeed(i*37)*270,s=.55+jiSeed(i*41)*1.2;
      g.fillStyle=i%2?"#3d805c":"#4c9462";
      g.beginPath();g.arc(x,y,38*s,0,Math.PI*2);g.arc(x-28*s,y+15*s,29*s,0,Math.PI*2);g.arc(x+31*s,y+17*s,31*s,0,Math.PI*2);g.fill();
      g.strokeStyle="#4a6046";g.lineWidth=7*s;g.beginPath();g.moveTo(x,y+25*s);g.lineTo(x,y+95*s);g.stroke();
    }
  }else if(type==="cave"){
    for(let i=0;i<70;i++){
      const x=jiSeed(i*7)*1920,y=jiSeed(i*11)*1080;
      g.fillStyle=i%2?"#4a4164":"#37324d";
      g.beginPath();g.ellipse(x,y,18+jiSeed(i)*50,8+jiSeed(i*5)*25,.4,0,Math.PI*2);g.fill();
    }
    for(let i=0;i<30;i++){
      const x=jiSeed(i*17)*1920,y=250+jiSeed(i*19)*650;
      g.fillStyle=i%2?"#5ed1d7":"#5764ad";
      g.beginPath();g.moveTo(x-12,y);g.lineTo(x,y-55-jiSeed(i)*70);g.lineTo(x+13,y);g.closePath();g.fill();
    }
  }else{
    // fortress painted skyline
    for(let i=0;i<16;i++){
      const x=i*135-40,h=180+(i%4)*75;
      g.fillStyle=i%2?"#2e2431":"#372835";g.fillRect(x,680-h,110,h);
      g.fillStyle="#201923";g.beginPath();g.moveTo(x-15,680-h);g.lineTo(x+55,590-h);g.lineTo(x+125,680-h);g.closePath();g.fill();
      g.fillStyle="#c05d4f";g.fillRect(x+45,680-h+60,18,32);
    }
  }
  return c;
}

function jiDrawMovingPlatform(gm){

  const x=p.x,y=p.y,w=p.w,h=Math.min(p.h,52);
  ctx.save();

  // fully cover old grass/stone platform top so it has a distinct identity
  let base=ctx.createLinearGradient(0,y,0,y+h);
  if(gm.kind==="blink"){
    base.addColorStop(0,"#9c8eea");base.addColorStop(.45,"#554b9c");base.addColorStop(1,"#24294f");
  }else if(gm.kind==="fall"){
    base.addColorStop(0,"#d59042");base.addColorStop(.45,"#8a4f35");base.addColorStop(1,"#3a2930");
  }else{
    base.addColorStop(0,"#6ecdd0");base.addColorStop(.42,"#267d8a");base.addColorStop(1,"#173d56");
  }
  ctx.fillStyle=base;ctx.beginPath();ctx.roundRect(x,y,w,h,12);ctx.fill();
  ctx.strokeStyle="#15263a";ctx.lineWidth=5;ctx.stroke();

  // top inset plate
  ctx.fillStyle=gm.kind==="blink"?"#c5b9ff":gm.kind==="fall"?"#f0b766":"#9ae5dc";
  ctx.beginPath();ctx.roundRect(x+8,y+7,w-16,8,4);ctx.fill();

  // repeating hand-painted rune plates
  for(let px=x+28;px<x+w-18;px+=58){
    ctx.fillStyle="rgba(10,25,40,.28)";
    ctx.beginPath();ctx.roundRect(px-16,y+20,32,19,6);ctx.fill();
    ctx.strokeStyle=gm.kind==="blink"?"#e1d9ff":gm.kind==="fall"?"#ffd38a":"#bffcf1";
    ctx.lineWidth=2.5;
    ctx.beginPath();
    if(gm.kind==="move"){
      ctx.moveTo(px-8,y+30);ctx.lineTo(px,y+23);ctx.lineTo(px+8,y+30);ctx.lineTo(px,y+36);ctx.closePath();

/* ---------- Final runtime overrides ---------- */
drawBackground=function(){

  // fixed painted plate + slow parallax duplicate for motion
  ctx.drawImage(img,0,0,WIDTH,HEIGHT);
  if(type!=="cave"&&type!=="fortress"){
    // translucent-free far illustrated islands
    for(let i=0;i<7;i++){
      const loop=2600;
      const x=((i*430+120-cameraX*(.035+i*.005))%loop+loop)%loop-180;
      const y=150+(i%3)*125,s=.72+(i%2)*.22;
      ctx.fillStyle=type==="sunset"?"#66767b":"#648d80";
      ctx.beginPath();ctx.moveTo(x-70*s,y);ctx.quadraticCurveTo(x,y+150*s,x+70*s,y);ctx.closePath();ctx.fill();
      ctx.fillStyle=type==="sunset"?"#b7b760":"#79bf64";
      ctx.beginPath();ctx.ellipse(x,y-5*s,75*s,19*s,0,0,Math.PI*2);ctx.fill();
