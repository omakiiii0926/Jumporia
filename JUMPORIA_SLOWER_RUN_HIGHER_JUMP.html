/* ==========================================================
   JUMPORIA GRAND ADVENTURE EXPANSION v27
   Stars / Secret exits / World gimmicks / Unique enemies /
   Unique bosses / Secret World 4
========================================================== */
const JGA_KEY="jumporiaGrandAdventureV27";
let jga={stars:{},secrets:{},world4:false};
try{Object.assign(jga,JSON.parse(localStorage.getItem(JGA_KEY)||"{}"));}catch(e){}
const jgaSave=()=>localStorage.setItem(JGA_KEY,JSON.stringify(jga));
const jgaTotalStars=()=>Object.values(jga.stars).reduce((a,b)=>a+(+b||0),0);

let jgaCoins=0,jgaHit=false,jgaSecret=null,jgaMoving=[],jgaHazards=[],jgaEnemyMeta=new WeakMap();
let jgaPrevScore=0,jgaPrevLives=0;

function jgaWorld(){return currentCourse>=15?4:Math.floor(currentCourse/5)+1}
function jgaStage(){return currentCourse>=15?currentCourse-14:(currentCourse%5)+1}
function jgaKey(){return ""+currentCourse}

function jgaEnsureWorld4(){
  if(courses.length>=20||typeof makeChallengeCourse!=="function")return;
  courses.push(
    makeChallengeCourse("4-1 星影の境界","sky",4,1,false),
    makeChallengeCourse("4-2 幻影クリスタル迷宮","cave",4,2,false),
    makeChallengeCourse("4-3 コメット断崖","sunset",4,3,false),
    makeChallengeCourse("4-4 次元の天空回廊","sky",4,4,false),
    makeChallengeCourse("4-BOSS OMEGA CROWN","fortress",4,5,true)
  );
}

function jgaUnlockCheck(){
  jga.world4=jgaTotalStars()>=35&&Object.keys(jga.secrets).length>=3;
  jgaSave();
}

function jgaSetup(){
  jgaCoins=0;jgaHit=false;jgaSecret=null;jgaMoving=[];jgaHazards=[];
  jgaEnemyMeta=new WeakMap();jgaPrevScore=score;jgaPrevLives=lives;
  const w=jgaWorld(),st=jgaStage();

  /* stage-specific enemy identity + behavior */
  const names=[
    ["MOSS HOPPER","PIPE CRAWLER","SUN DASHER","CLOUD DIVER","IRON GUARD"],
    ["WIND RUNNER","CRYSTAL CLIMBER","EMBER HOPPER","SKY CHASER","BLAZE GUARD"],
    ["STORM DASHER","ABYSS CRAWLER","FLARE LEAPER","VOID DIVER","TEMPEST GUARD"],
    ["STAR STALKER","PHANTOM CLIMBER","COMET LEAPER","RIFT DIVER","OMEGA GUARD"]
  ];
  enemies.forEach((e,i)=>{
    jgaEnemyMeta.set(e,{w,st,name:names[w-1][Math.min(4,st-1)],phase:i*1.37,baseY:e.y});
    if(w===2)e.vx*=1.10;
    if(w===3)e.vx*=1.20;
    if(w===4)e.vx*=1.32;
  });

  /* WORLD-specific gimmicks */
  const elevated=platforms.filter(p=>p.y<710&&p.w>=80).slice(1,8);
  if(w===2){
    elevated.forEach((p,i)=>jgaMoving.push({p,bx:p.x,by:p.y,phase:i*1.2,kind:st===3?"fall":"move"}));
  }
  if(w===3){
    elevated.forEach((p,i)=>jgaMoving.push({p,bx:p.x,by:p.y,phase:i*.95,kind:i%2?"move":"blink"}));
    for(let x=1150;x<currentWorldWidth-600;x+=1450)jgaHazards.push({x,y:748,w:230,h:24});
  }
  if(w===4){
    elevated.forEach((p,i)=>jgaMoving.push({p,bx:p.x,by:p.y,phase:i*.75,kind:i%3===0?"blink":"move"}));
    for(let x=950;x<currentWorldWidth-500;x+=1050)jgaHazards.push({x,y:744,w:280,h:28});
  }

  /* secret exit: all non-boss normal worlds */
  if(st!==5){
    const ps=platforms.filter(p=>p.w>=120&&p.x>currentWorldWidth*.62);
    const p=ps.length?ps[Math.max(0,ps.length-2)]:platforms[platforms.length-1];
    if(p)jgaSecret={x:p.x+p.w*.55,y:p.y-70,w:46,h:70,used:false};
  }
}

function jgaUpdate(){
  const w=jgaWorld(),st=jgaStage(),tm=performance.now()/1000;

  /* world wind */
  if(!player.grounded){
    if(w===2&&(st===1||st===4))player.vx+=0.06;
    if(w===3)player.vx+=(st===2?-0.09:0.09);
    if(w===4)player.vx+=0.12;
  }

  for(const g of jgaMoving){
    if(g.kind==="move"){
      g.p.x=g.bx+Math.sin(tm*(w===4?2.1:1.25)+g.phase)*(w===4?85:58);
    }else if(g.kind==="fall"){
      const on=player.x+player.w>g.p.x&&player.x<g.p.x+g.p.w&&Math.abs(player.y+player.h-g.p.y)<18;
      if(on)g.f=(g.f||0)+1;
      if((g.f||0)>20)g.p.y=Math.min(g.by+190,g.p.y+3.8);
    }else if(g.kind==="blink"){
      g.p._jgaVisible=Math.sin(tm*1.7+g.phase)>-.45;
    }
  }

  /* stage-specific enemy moves */
  enemies.forEach(e=>{
    if(!e.alive)return;
    const m=jgaEnemyMeta.get(e); if(!m)return;
    if(m.st===1&&m.w>=2&&Math.sin(tm*2.4+m.phase)>.992)e.vy=-7.5;
    if(m.st===2&&m.w>=2)e.y+=Math.sin(tm*3+m.phase)*.22;
    if(m.st===3&&m.w>=2&&Math.sin(tm*2.1+m.phase)>.995)e.vx*=1.08;
    if(m.st===4&&m.w>=2)e.y+=Math.sin(tm*4+m.phase)*.35;
  });

  /* hazards */
  for(const h of jgaHazards){
    if(player.x+player.w>h.x&&player.x<h.x+h.w&&player.y+player.h>h.y&&player.y<h.y+h.h){
      jgaHit=true;
      if(typeof hurtPlayer==="function")hurtPlayer();
    }
  }

  /* secret exit */
  if(jgaSecret&&!jgaSecret.used){
    const q=jgaSecret;
    if(player.x+player.w>q.x&&player.x<q.x+q.w&&player.y+player.h>q.y&&player.y<q.y+q.h){
      q.used=true;jga.secrets[jgaKey()]=true;jgaUnlockCheck();
      addScore(2500);message.textContent="✨ SECRET EXIT!";
      if(typeof showGoalOverlay==="function")showGoalOverlay();
    }
  }

  /* approximate collectible progress from score deltas without touching core coin logic */
  if(score>jgaPrevScore&&score-jgaPrevScore<=250)jgaCoins++;
  if(lives<jgaPrevLives)jgaHit=true;
  jgaPrevScore=score;jgaPrevLives=lives;

  /* boss personalities */
  if(typeof boss!=="undefined"&&boss&&boss.active){
    if(w===2&&Math.sin(tm*1.9)>.994)boss.vy=-10;
    if(w===3)boss.y+=Math.sin(tm*3.2)*.45;
    if(w===4){boss.y+=Math.sin(tm*4.0)*.7;boss.vx*=1.0015;}
  }
}

function jgaDraw(){
  const w=jgaWorld(),st=jgaStage();

  /* hazards */
  ctx.save();
  for(const h of jgaHazards){
    const x=h.x-cameraX;
    ctx.fillStyle=w===4?"#b33d85":"#ef5934";ctx.fillRect(x,h.y,h.w,h.h);
    ctx.fillStyle="#ffd45c";
    for(let i=0;i<h.w;i+=30){ctx.beginPath();ctx.arc(x+i,h.y+4,9,Math.PI,0);ctx.fill()}
  }

  /* secret gate */
  if(jgaSecret&&!jgaSecret.used){
    const q=jgaSecret,x=q.x-cameraX,y=q.y;
    ctx.fillStyle="#27365f";ctx.fillRect(x,y+18,q.w,q.h-18);
    ctx.fillStyle="#8cecff";ctx.fillRect(x+7,y+25,q.w-14,q.h-25);
    ctx.fillStyle="#ffe46c";ctx.beginPath();ctx.arc(x+q.w/2,y+39,7,0,Math.PI*2);ctx.fill();
    ctx.font="bold 15px sans-serif";ctx.textAlign="center";ctx.fillStyle="#fff";ctx.fillText("S",x+q.w/2,y+62);
  }

  /* enemy stage-color mark */
  enemies.forEach(e=>{
    if(!e.alive)return; const m=jgaEnemyMeta.get(e);if(!m)return;
    const x=e.x-cameraX+e.w/2;if(x<-80||x>WIDTH+80)return;
    ctx.fillStyle=["#9ce77c","#79dcff","#ff9d68","#d695ff"][m.w-1];
    ctx.fillRect(x-15,e.y-8,30,4);
  });

  /* star HUD */
  const s=jga.stars[jgaKey()]||0;
  ctx.font="bold 18px sans-serif";ctx.textAlign="right";
  ctx.strokeStyle="#24334b";ctx.lineWidth=4;ctx.fillStyle="#ffe875";
  const txt="★".repeat(s)+"☆".repeat(3-s)+"  W"+w+"-"+st;
  ctx.strokeText(txt,WIDTH-18,35);ctx.fillText(txt,WIDTH-18,35);
  ctx.restore();
}

function jgaAwardStars(){
  let n=1;
  if(jgaCoins>=8)n++;
  if(!jgaHit)n++;
  const k=jgaKey();
  jga.stars[k]=Math.max(jga.stars[k]||0,n);
  jgaUnlockCheck();
  return n;
}
